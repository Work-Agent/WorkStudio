<!doctype html>
<!--
  Markdown 阅读器 config 页（markdown-viewer 插件）。
  偏好存本插件 partition 的 localStorage（与扩展页同源共享）。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 阅读器</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --input-bg: #ffffff;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --input-bg: #1c1e1f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-top: 16px;
      }
      .card h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }
      .row label {
        flex: 1;
        font-size: 12.5px;
      }
      .row .hint {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      select {
        width: 160px;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
      }
      button {
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .foot {
        margin: 16px 2px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 7px 13px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Markdown 阅读器</h1>
        <p>
          为 <code>.md</code> /
          <code>.markdown</code> 文件提供渲染预览与源码编辑，
          保存直接写回工作区文件。
        </p>
      </header>

      <section class="card">
        <h3>阅读偏好</h3>
        <div class="row">
          <label>
            默认视图
            <span class="hint">打开 Markdown 文件时的初始模式</span>
          </label>
          <select id="default-mode">
            <option value="preview">预览</option>
            <option value="source">源码</option>
          </select>
        </div>
        <div class="row">
          <label>
            正文字号
            <span class="hint">预览与源码共用</span>
          </label>
          <select id="font-size">
            <option value="13">13px</option>
            <option value="13.5">13.5px（默认）</option>
            <option value="14">14px</option>
            <option value="15">15px</option>
            <option value="16">16px</option>
          </select>
        </div>
        <div class="row" style="justify-content: flex-end">
          <button class="primary" id="save">保存</button>
        </div>
      </section>

      <p class="foot">
        渲染为安全内联实现：原始 HTML 不直通（先转义再生成标签），支持标题 /
        列表 / 任务列表 / 表格 / 引用 / 围栏代码 / 行内代码 / 链接 / 图片 /
        强调。
      </p>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const PREF_MODE = 'markdown-viewer:defaultMode';
      const PREF_SIZE = 'markdown-viewer:fontSize';
      const $ = (id) => document.getElementById(id);

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      function load() {
        try {
          $('default-mode').value =
            localStorage.getItem(PREF_MODE) || 'preview';
          $('font-size').value = localStorage.getItem(PREF_SIZE) || '13.5';
        } catch {
          /* ignore */
        }
      }

      function save() {
        try {
          localStorage.setItem(PREF_MODE, $('default-mode').value);
          localStorage.setItem(PREF_SIZE, $('font-size').value);
          toast('已保存');
        } catch (e) {
          toast('保存失败：' + (e && e.message ? e.message : e));
        }
      }

      let timer = 0;
      function toast(message) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show';
        clearTimeout(timer);
        timer = setTimeout(() => (el.className = 'toast'), 2000);
      }

      $('save').onclick = save;
      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      load();
    </script>
  </body>
</html>
