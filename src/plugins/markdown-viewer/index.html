<!doctype html>
<!--
  Markdown 阅读器（markdown-viewer 插件扩展页）。
  数据面：window.extension.ura（页面会话投递 + 严格保存）。
  渲染：内置安全渲染器——先转义再生成标签（原始 HTML 不直通），支持标题 / 列表 /
  任务列表 / 表格 / 引用 / 围栏代码 / 行内代码 / 链接 / 图片 / 强调。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --input-bg: #ffffff;
        --soft: #fafafa;
        --code-bg: #f4f4f5;
        --quote: #d4d4d8;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --input-bg: #1c1e1f;
        --soft: #1c1e1f;
        --code-bg: #1c1e1f;
        --quote: #3f4245;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .pane {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .md-body {
        max-width: 780px;
        margin: 0 auto;
        padding: 22px 28px 80px;
        line-height: 1.7;
        font-size: var(--md-size, 13.5px);
        word-wrap: break-word;
      }
      .md-body > *:first-child {
        margin-top: 0;
      }
      .md-body h1,
      .md-body h2,
      .md-body h3,
      .md-body h4,
      .md-body h5,
      .md-body h6 {
        margin: 1.4em 0 0.6em;
        line-height: 1.35;
        font-weight: 600;
      }
      .md-body h1 {
        font-size: 22px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }
      .md-body h2 {
        font-size: 18px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }
      .md-body h3 {
        font-size: 15.5px;
      }
      .md-body h4 {
        font-size: 14px;
      }
      .md-body p {
        margin: 0.6em 0;
      }
      .md-body a {
        color: var(--accent);
        text-decoration: none;
      }
      .md-body a:hover {
        text-decoration: underline;
      }
      .md-body code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .md-body pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        overflow: auto;
      }
      .md-body pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 12px;
        line-height: 1.6;
      }
      .md-body blockquote {
        margin: 0.8em 0;
        padding: 2px 14px;
        border-left: 3px solid var(--quote);
        color: var(--muted);
      }
      .md-body ul,
      .md-body ol {
        margin: 0.5em 0;
        padding-left: 1.6em;
      }
      .md-body li {
        margin: 0.25em 0;
      }
      .md-body li > p {
        margin: 0.25em 0;
      }
      .md-body table {
        border-collapse: collapse;
        margin: 0.8em 0;
        font-size: 12.5px;
        display: block;
        overflow-x: auto;
        max-width: 100%;
      }
      .md-body th,
      .md-body td {
        border: 1px solid var(--border);
        padding: 5px 10px;
        text-align: left;
      }
      .md-body th {
        background: var(--soft);
        font-weight: 600;
      }
      .md-body hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 1.4em 0;
      }
      .md-body img {
        max-width: 100%;
        border-radius: 6px;
      }
      .md-body input[type='checkbox'] {
        margin-right: 6px;
        vertical-align: -1px;
      }
      textarea {
        display: none;
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        resize: none;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: var(--md-size, 12.5px);
        line-height: 1.65;
        padding: 18px 22px 80px;
      }
      body.source textarea {
        display: block;
      }
      body.source .md-body {
        display: none;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 7px 13px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="pane">
      <article class="md-body" id="preview"></article>
      <textarea id="source" spellcheck="false"></textarea>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      // ── 状态 ─────────────────────────────────────────────
      const state = {
        meta: null,
        original: '',
        content: '',
        dirty: false,
        mode: 'preview',
      };

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );

      // ── Markdown 渲染（安全：先转义，标签只由渲染器生成） ──

      const CODE_MARK = '\u0000';

      function inline(text) {
        const codes = [];
        let t = text.replace(/`([^`]+)`/g, (_m, c) => {
          codes.push(c);
          return CODE_MARK + (codes.length - 1) + CODE_MARK;
        });
        t = esc(t);
        // 图片 → 链接（图片必须先处理，避免被链接规则吞掉）
        t = t.replace(/!\[([^\]]*)\]\(([^\s)]+)\)/g, '<img alt="$1" src="$2">');
        t = t.replace(
          /\[([^\]]+)\]\(([^\s)]+)\)/g,
          '<a href="$2" target="_blank" rel="noreferrer">$1</a>',
        );
        t = t.replace(
          /(^|[\s(])(https?:\/\/[^\s<)]+)/g,
          '$1<a href="$2" target="_blank" rel="noreferrer">$2</a>',
        );
        t = t
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/__([^_]+)__/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/(^|[\s(])_([^_]+)_(?=[\s.,;:)!?]|$)/g, '$1<em>$2</em>')
          .replace(/~~([^~]+)~~/g, '<del>$1</del>');
        t = t.replace(
          new RegExp(CODE_MARK + '(\\d+)' + CODE_MARK, 'g'),
          (_m, i) => '<code>' + esc(codes[Number(i)] ?? '') + '</code>',
        );
        return t;
      }

      const BLOCK_START =
        /^(\s*$|\s*```|\s*~~~|\s*#{1,6}\s|\s*>|\s*([-*+]|\d+[.)])\s+| {0,3}(-{3,}|\*{3,}|_{3,})\s*$|\s*\|)/;

      function renderBlocks(src) {
        const lines = src.replace(/\r\n?/g, '\n').split('\n');
        const out = [];
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (/^\s*$/.test(line)) {
            i++;
            continue;
          }

          // 围栏代码
          let m = /^(\s*)(`{3,}|~{3,})\s*([^\s`]*)\s*$/.exec(line);
          if (m) {
            const indent = m[1];
            const fence = m[2][0];
            const minLen = m[2].length;
            const lang = m[3] || '';
            const buf = [];
            i++;
            while (i < lines.length) {
              if (
                new RegExp('^\\s*' + fence + '{' + minLen + ',}\\s*$').test(
                  lines[i],
                )
              ) {
                i++;
                break;
              }
              buf.push(
                lines[i].startsWith(indent)
                  ? lines[i].slice(indent.length)
                  : lines[i],
              );
              i++;
            }
            out.push(
              '<pre><code' +
                (lang ? ' class="language-' + esc(lang) + '"' : '') +
                '>' +
                esc(buf.join('\n')) +
                '</code></pre>',
            );
            continue;
          }

          // 标题
          m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line);
          if (m) {
            const level = m[1].length;
            out.push('<h' + level + '>' + inline(m[2]) + '</h' + level + '>');
            i++;
            continue;
          }

          // 分隔线
          if (/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
            out.push('<hr>');
            i++;
            continue;
          }

          // 表格（下一行为分隔行）
          if (
            line.includes('|') &&
            i + 1 < lines.length &&
            /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(
              lines[i + 1],
            ) &&
            lines[i + 1].includes('-')
          ) {
            const [table, next] = renderTable(lines, i);
            out.push(table);
            i = next;
            continue;
          }

          // 引用
          if (/^\s*>/.test(line)) {
            const buf = [];
            while (i < lines.length && /^\s*>/.test(lines[i])) {
              buf.push(lines[i].replace(/^\s*>\s?/, ''));
              i++;
            }
            out.push(
              '<blockquote>' + renderBlocks(buf.join('\n')) + '</blockquote>',
            );
            continue;
          }

          // 列表
          if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
            const [list, next] = renderList(lines, i);
            out.push(list);
            i = next;
            continue;
          }

          // 段落
          const para = [line];
          i++;
          while (i < lines.length && !BLOCK_START.test(lines[i])) {
            para.push(lines[i]);
            i++;
          }
          out.push('<p>' + inline(para.join('\n')) + '</p>');
        }
        return out.join('\n');
      }

      function splitRow(row) {
        return row
          .replace(/^\s*\|/, '')
          .replace(/\|\s*$/, '')
          .split('|')
          .map((s) => s.trim());
      }

      function renderTable(lines, start) {
        const head = splitRow(lines[start]);
        const align = splitRow(lines[start + 1]).map((cell) => {
          const left = cell.startsWith(':');
          const right = cell.endsWith(':');
          if (left && right) return 'center';
          if (right) return 'right';
          if (left) return 'left';
          return '';
        });
        let i = start + 2;
        const rows = [];
        while (
          i < lines.length &&
          lines[i].includes('|') &&
          !/^\s*$/.test(lines[i])
        ) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        const styleOf = (idx) =>
          align[idx] ? ' style="text-align:' + align[idx] + '"' : '';
        let html = '<table><thead><tr>';
        head.forEach((cell, idx) => {
          html += '<th' + styleOf(idx) + '>' + inline(cell) + '</th>';
        });
        html += '</tr></thead><tbody>';
        for (const row of rows) {
          html += '<tr>';
          for (let c = 0; c < head.length; c++) {
            html += '<td' + styleOf(c) + '>' + inline(row[c] ?? '') + '</td>';
          }
          html += '</tr>';
        }
        return [html + '</tbody></table>', i];
      }

      const ITEM_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

      function renderList(lines, start) {
        const first = ITEM_RE.exec(lines[start]);
        const ordered = /\d/.test(first[2]);
        const baseIndent = first[1].length;
        const items = [];
        let i = start;
        while (i < lines.length) {
          const m = ITEM_RE.exec(lines[i]);
          if (!m || m[1].length !== baseIndent) break;
          const markerWidth = m[2].length + 1;
          const buf = [m[3]];
          i++;
          // 收集该项的续行（含嵌套列表；按 marker 宽度去缩进）
          while (i < lines.length) {
            const l = lines[i];
            if (/^\s*$/.test(l)) {
              if (i + 1 < lines.length && /^\s{2,}/.test(lines[i + 1])) {
                buf.push('');
                i++;
                continue;
              }
              break;
            }
            const im = ITEM_RE.exec(l);
            if (im && im[1].length <= baseIndent) break;
            const indent = /^\s*/.exec(l)[0].length;
            if (indent <= baseIndent) break;
            buf.push(l.slice(Math.min(indent, baseIndent + markerWidth)));
            i++;
          }
          items.push(renderItem(buf.join('\n')));
        }
        const tag = ordered ? 'ol' : 'ul';
        return ['<' + tag + '>' + items.join('') + '</' + tag + '>', i];
      }

      function renderItem(src) {
        let inner = renderBlocks(src);
        // 任务列表
        const task = /^\[([ xX])\]\s?(.*)$/.exec(
          src.trimStart().split('\n')[0],
        );
        if (task) {
          const checked = task[1].toLowerCase() === 'x';
          inner = inner.replace(
            /<p>\[[ xX]\]\s?/,
            '<p><input type="checkbox" disabled' +
              (checked ? ' checked' : '') +
              '>',
          );
        }
        // 单段落解包（列表项内的 <p> 视觉冗余）
        const single = /^<p>([\s\S]*)<\/p>$/.exec(inner);
        if (single && !single[1].includes('<p>')) inner = single[1];
        return '<li>' + inner + '</li>';
      }

      function renderMarkdown(src) {
        return renderBlocks(src || '');
      }

      // ── 视图 ─────────────────────────────────────────────

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      function setMode(mode) {
        state.mode = mode;
        if (mode === 'source' && state.content !== $('source').value) {
          $('source').value = state.content;
        }
        if (mode === 'preview') {
          $('preview').innerHTML = renderMarkdown(state.content);
        }
        document.body.classList.toggle('source', mode === 'source');
        // 标题栏动作状态回报（TitleBar 按钮随状态换图标/标题）
        window.extension.bus.send({
          type: 'actionState',
          id: 'layout-switch',
          value: mode,
        });
      }

      function cycleMode() {
        setMode(state.mode === 'preview' ? 'source' : 'preview');
      }

      function setDirty(dirty) {
        state.dirty = dirty;
        window.extension.bus.send({ type: 'dirty', dirty });
      }

      function applyContent(payload) {
        state.meta = payload.meta;
        state.content = payload.content ?? '';
        state.original = state.content;
        $('source').value = state.content;
        $('preview').innerHTML = renderMarkdown(state.content);
        setDirty(false);
      }

      /** URA 页面会话投递（新契约）。 */
      function applyInfo(info) {
        state.meta = { id: info.ref };
        state.content = (info.data && info.data.text) || '';
        state.original = state.content;
        $('source').value = state.content;
        $('preview').innerHTML = renderMarkdown(state.content);
        setDirty(false);
      }

      const bus = window.extension.bus;
      const ura = window.extension.ura;
      const sessionId = new URLSearchParams(location.search).get('session');

      bus.on((msg) => {
        if (msg.type === 'content') applyContent(msg.payload);
        else if (msg.type === 'theme') applyTheme(msg.theme);
        else if (msg.type === 'action') {
          if (msg.id === 'layout-switch') cycleMode();
          else if (msg.id === 'save') void save();
        }
      });

      // ── 交互 ─────────────────────────────────────────────

      $('source').addEventListener('input', (e) => {
        state.content = e.target.value;
        setDirty(state.content !== state.original);
      });

      async function save() {
        if (!state.meta || !state.dirty) return;
        try {
          const result = await ura.page.save(sessionId, state.content);
          if (!result.ok) {
            toast('内容已被外部修改：请重新加载后再保存', true);
            return;
          }
          state.original = state.content;
          setDirty(false);
          toast('已保存');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
      }

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          void save();
        }
      });

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 2200);
      }

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      // 插件偏好（config 页写入同一 partition 的 localStorage）
      try {
        const size = localStorage.getItem('markdown-viewer:fontSize');
        if (size)
          document.documentElement.style.setProperty('--md-size', size + 'px');
        setMode(
          localStorage.getItem('markdown-viewer:defaultMode') === 'source'
            ? 'source'
            : 'preview',
        );
      } catch {
        setMode('preview');
      }
      if (sessionId) {
        ura.page
          .get(sessionId)
          .then((info) => {
            applyInfo(info);
            void ura.watch(info.ref);
            ura.onChange((event) => {
              if (!state.dirty && event && event.ref === info.ref) {
                void ura.page.reload(sessionId).then(applyInfo);
              }
            });
          })
          .catch((e) => toast(e && e.message ? e.message : String(e), true));
      }
      bus.loaded();
    </script>
  </body>
</html>
