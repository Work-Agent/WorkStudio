<!doctype html>
<!--
  技能（skills 插件 config 页）。
  数据面：app:skills.view / reload（清单 + 装载诊断 + 当前启用集合）+ app:storage.open（打开 SKILL.md）。
  装载链归 pi（additionalSkillPaths + ResourceLoader）；本页只读展示，不新增第二套语义。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>技能</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --input-bg: #ffffff;
        --soft: #fafafa;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --input-bg: #1c1e1f;
        --soft: #1c1e1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        overflow: auto;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      header .grow {
        flex: 1;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 14px;
      }
      input[type='text'] {
        flex: 1;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12.5px;
        font-family: inherit;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.mini {
        padding: 3px 9px;
        font-size: 11px;
      }
      .count {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .card {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }
      .item {
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
      }
      .item:last-child {
        border-bottom: none;
      }
      .item .head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .item .head b {
        font-size: 13px;
        font-weight: 600;
      }
      .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge.scope {
        color: var(--accent);
        border-color: rgba(79, 107, 237, 0.35);
        background: rgba(79, 107, 237, 0.08);
      }
      .badge.active {
        color: #16a34a;
        border-color: rgba(22, 163, 74, 0.35);
        background: rgba(22, 163, 74, 0.08);
      }
      .item .desc {
        margin: 5px 0 0;
        font-size: 12.5px;
        line-height: 1.65;
        color: var(--fg);
      }
      .item .path {
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .item .path span {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
      }
      .empty {
        padding: 22px 14px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }
      .diag {
        margin-top: 14px;
        border: 1px solid rgba(220, 38, 38, 0.3);
        background: rgba(220, 38, 38, 0.05);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
        line-height: 1.8;
      }
      .diag b {
        display: block;
        margin-bottom: 4px;
        color: #dc2626;
      }
      html[data-theme='dark'] .diag b {
        color: #f87171;
      }
      .diag .warn {
        color: #d97706;
      }
      .note {
        margin: 14px 2px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="grow">
          <h1>技能</h1>
          <p>
            已加载技能清单（来源：应用技能目录与插件声明的技能目录）。技能由 pi
            资源链装载； 对话中可在输入区选择启用集合，未选择 = 全量注入。
          </p>
        </div>
        <button class="primary" id="reload">重新装载</button>
      </header>

      <div class="row">
        <input
          type="text"
          id="q"
          placeholder="过滤技能（名称 / 描述 / 路径）…"
        />
        <span class="count" id="count"></span>
      </div>

      <div class="card" id="list"></div>
      <div id="diag"></div>

      <p class="note">
        SKILL.md 位置：应用技能目录（agent 目录下 <code>skills/</code>）与插件
        <code>manifest.skills</code>
        声明的目录；「仅手动」表示不注入提示词、只在对话里显式调用。
      </p>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const state = {
        skills: [],
        diagnostics: [],
        active: [],
        q: '',
        loading: false,
      };
      const invoke = (cmd, payload) => window.extension.invoke(cmd, payload);
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );

      const SCOPE_LABEL = {
        user: '用户级',
        project: '项目级',
        temporary: '临时',
        builtin: '内置',
      };

      function render() {
        const q = state.q.trim().toLowerCase();
        const list = state.skills.filter(
          (s) =>
            !q ||
            (s.name || '').toLowerCase().includes(q) ||
            (s.description || '').toLowerCase().includes(q) ||
            (s.path || '').toLowerCase().includes(q),
        );
        $('count').textContent =
          list.length +
          ' / ' +
          state.skills.length +
          (state.active.length ? '（已选 ' + state.active.length + '）' : '');

        if (list.length === 0) {
          $('list').innerHTML =
            '<div class="empty">' +
            (state.skills.length === 0
              ? '当前没有加载任何技能。<br/>把技能目录放进应用 agent 目录的 <code>skills/</code>，或由插件 manifest 声明 <code>skills</code>。'
              : '没有匹配的技能。') +
            '</div>';
        } else {
          $('list').innerHTML = list
            .map((s) => {
              const active =
                state.active.length === 0 || state.active.includes(s.name);
              return (
                '<div class="item">' +
                '<div class="head"><b>' +
                esc(s.name) +
                '</b>' +
                (state.active.includes(s.name)
                  ? '<span class="badge active">已选</span>'
                  : '') +
                (s.manualOnly ? '<span class="badge">仅手动</span>' : '') +
                '<span class="badge scope">' +
                esc(SCOPE_LABEL[s.scope] ?? s.scope ?? '未知') +
                '</span>' +
                (s.pluginId &&
                s.pluginId !== 'local' &&
                s.pluginId !== 'builtin'
                  ? '<span class="badge">' +
                    esc(s.pluginName || s.pluginId) +
                    '</span>'
                  : s.pluginId === 'local'
                    ? '<span class="badge">本机技能</span>'
                    : '') +
                '</div>' +
                (s.description
                  ? '<p class="desc">' + esc(s.description) + '</p>'
                  : '') +
                '<div class="path"><span title="' +
                esc(s.path || '') +
                '">' +
                esc(s.path || '（路径未知）') +
                '</span>' +
                (s.path
                  ? '<button class="mini" data-open="' +
                    esc(s.path) +
                    '">打开</button>'
                  : '') +
                '</div>' +
                '</div>'
              );
            })
            .join('');
        }

        const diags = state.diagnostics ?? [];
        $('diag').innerHTML =
          diags.length === 0
            ? ''
            : '<div class="diag"><b>装载诊断（' +
              diags.length +
              '）</b>' +
              diags
                .map(
                  (d) =>
                    '<div><span class="' +
                    (d.type === 'error' ? '' : 'warn') +
                    '">' +
                    esc(d.type) +
                    '</span> — ' +
                    esc(d.message) +
                    (d.path
                      ? ' <span style="color:var(--muted)">(' +
                        esc(d.path) +
                        ')</span>'
                      : '') +
                    '</div>',
                )
                .join('') +
              '</div>';
      }

      async function refresh(reload) {
        if (state.loading) return;
        state.loading = true;
        $('reload').disabled = true;
        $('reload').textContent = reload ? '装载中…' : '读取中…';
        try {
          const res = await invoke(
            reload ? 'app:skills.reload' : 'app:skills.view',
          );
          state.skills = res.skills ?? [];
          state.diagnostics = res.diagnostics ?? [];
          state.active = res.active ?? [];
          if (reload) toast('已重新装载技能');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        } finally {
          state.loading = false;
          $('reload').disabled = false;
          $('reload').textContent = '重新装载';
          render();
        }
      }

      $('reload').onclick = () => void refresh(true);
      $('q').addEventListener('input', (e) => {
        state.q = e.target.value;
        render();
      });
      document.addEventListener('click', (e) => {
        const open = e.target.closest('[data-open]');
        if (open) {
          void invoke('app:storage.open', { path: open.dataset.open }).catch(
            (err) =>
              toast(err && err.message ? err.message : String(err), true),
          );
        }
      });

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 2600);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      void refresh(false);
    </script>
  </body>
</html>
