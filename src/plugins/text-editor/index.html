<!doctype html>
<!--
  文本编辑器（text-editor 插件扩展页）—— 无专用渲染器时的通用兜底视图。
  数据面：页面会话投递 + ura.page.save 保存；偏好存插件 partition localStorage。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --soft: #fafafa;
        --gutter: #71717a;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --soft: #1c1e1f;
        --gutter: #5b5e60;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .pane {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }
      textarea {
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        resize: none;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: var(--editor-size, 12.5px);
        line-height: 1.65;
        padding: 16px 20px 80px;
      }
      textarea.nowrap {
        white-space: pre;
        overflow-x: auto;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 7px 13px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="pane">
      <textarea id="editor" spellcheck="false" wrap="soft"></textarea>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const PREF_WRAP = 'text-editor:wordWrap';
      const PREF_SIZE = 'text-editor:fontSize';

      const state = {
        meta: null,
        original: '',
        content: '',
        dirty: false,
        wrap: true,
        readOnly: false,
      };
      const $ = (id) => document.getElementById(id);

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      function setWrap(on) {
        state.wrap = on;
        $('editor').classList.toggle('nowrap', !on);
        window.extension.bus.send({
          type: 'actionState',
          id: 'toggle-wrap',
          value: on ? 'on' : 'off',
        });
      }

      function toggleWrap() {
        setWrap(!state.wrap);
        try {
          localStorage.setItem(PREF_WRAP, state.wrap ? '1' : '0');
        } catch {
          /* ignore */
        }
      }

      function setDirty(dirty) {
        state.dirty = dirty;
        window.extension.bus.send({ type: 'dirty', dirty });
      }

      function applyContent(payload) {
        state.meta = payload.meta;
        state.readOnly = payload.type === 'data';
        state.content = payload.content ?? '';
        state.original = state.content;
        $('editor').value = state.content;
        $('editor').readOnly = state.readOnly;
        setDirty(false);
      }

      /** URA 页面会话投递（新契约）。 */
      function applyInfo(info) {
        state.meta = { id: info.ref };
        state.readOnly = false;
        state.content = (info.data && info.data.text) || '';
        state.original = state.content;
        $('editor').value = state.content;
        $('editor').readOnly = state.readOnly;
        setDirty(false);
      }

      const bus = window.extension.bus;
      const ura = window.extension.ura;
      const sessionId = new URLSearchParams(location.search).get('session');

      bus.on((msg) => {
        if (msg.type === 'content') applyContent(msg.payload);
        else if (msg.type === 'theme') applyTheme(msg.theme);
        else if (msg.type === 'action') {
          if (msg.id === 'toggle-wrap') toggleWrap();
          else if (msg.id === 'save') void save();
        }
      });

      $('editor').addEventListener('input', (e) => {
        if (state.readOnly) return;
        state.content = e.target.value;
        setDirty(state.content !== state.original);
      });

      async function save() {
        if (!state.meta || state.readOnly || !state.dirty) return;
        try {
          const result = await ura.page.save(sessionId, state.content);
          if (!result.ok) {
            toast('内容已被外部修改：请重新加载后再保存', true);
            return;
          }
          state.original = state.content;
          setDirty(false);
          toast('已保存');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
      }

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          void save();
        }
      });

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 2200);
      }

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      try {
        const size = localStorage.getItem(PREF_SIZE);
        if (size)
          document.documentElement.style.setProperty(
            '--editor-size',
            size + 'px',
          );
        setWrap(localStorage.getItem(PREF_WRAP) !== '0');
      } catch {
        setWrap(true);
      }
      if (sessionId) {
        ura.page
          .get(sessionId)
          .then((info) => {
            applyInfo(info);
            void ura.watch(info.ref);
            ura.onChange((event) => {
              if (!state.dirty && event && event.ref === info.ref) {
                void ura.page.reload(sessionId).then(applyInfo);
              }
            });
          })
          .catch((e) => toast(e && e.message ? e.message : String(e), true));
      }
      bus.loaded();
    </script>
  </body>
</html>
