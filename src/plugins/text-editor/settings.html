<!doctype html>
<!--
  文本编辑器 config 页（text-editor 插件）。
  偏好存本插件 partition 的 localStorage（与扩展页同源共享）。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本编辑器</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --input-bg: #ffffff;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --input-bg: #1c1e1f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-top: 16px;
      }
      .card h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }
      .row label {
        flex: 1;
        font-size: 12.5px;
      }
      .row .hint {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      select {
        width: 160px;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
      }
      button {
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .foot {
        margin: 16px 2px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 7px 13px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>文本编辑器</h1>
        <p>
          通用纯文本兜底渲染器：未匹配专用视图的文件（txt / json / 代码 /
          配置等） 默认用它打开，编辑后直接写回工作区。
        </p>
      </header>

      <section class="card">
        <h3>编辑偏好</h3>
        <div class="row">
          <label> 字号 </label>
          <select id="font-size">
            <option value="11.5">11.5px</option>
            <option value="12">12px</option>
            <option value="12.5">12.5px（默认）</option>
            <option value="13">13px</option>
            <option value="14">14px</option>
            <option value="15">15px</option>
          </select>
        </div>
        <div class="row">
          <label>
            默认自动换行
            <span class="hint">关闭后长行横向滚动（代码文件推荐）</span>
          </label>
          <input type="checkbox" id="word-wrap" checked />
        </div>
        <div class="row" style="justify-content: flex-end">
          <button class="primary" id="save">保存</button>
        </div>
      </section>

      <p class="foot">
        编辑器不提供语法高亮；大文件（&gt; 4
        MB）由资源网关按元数据列出、内容不读取。
      </p>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const PREF_WRAP = 'text-editor:wordWrap';
      const PREF_SIZE = 'text-editor:fontSize';
      const $ = (id) => document.getElementById(id);

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      function load() {
        try {
          $('font-size').value = localStorage.getItem(PREF_SIZE) || '12.5';
          $('word-wrap').checked = localStorage.getItem(PREF_WRAP) !== '0';
        } catch {
          /* ignore */
        }
      }

      function save() {
        try {
          localStorage.setItem(PREF_SIZE, $('font-size').value);
          localStorage.setItem(PREF_WRAP, $('word-wrap').checked ? '1' : '0');
          toast('已保存');
        } catch (e) {
          toast('保存失败：' + (e && e.message ? e.message : e));
        }
      }

      let timer = 0;
      function toast(message) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show';
        clearTimeout(timer);
        timer = setTimeout(() => (el.className = 'toast'), 2000);
      }

      $('save').onclick = save;
      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      load();
    </script>
  </body>
</html>
