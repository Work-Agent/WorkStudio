<!doctype html>
<!--
  HTML 阅读器（html-viewer 插件扩展页）。
  三态：预览（iframe srcdoc，脚本默认关闭）/ 分屏 / 源码；保存经 ura.page.save。
  相对资源（同目录 CSS / 图片）在 srcdoc 中不可解析——预览仅内联内容，源码模式不受限。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --soft: #fafafa;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --soft: #1c1e1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panes {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .panes > * {
        min-width: 0;
        min-height: 0;
      }
      iframe.preview {
        flex: 1 1 50%;
        border: none;
        background: #fff;
      }
      textarea {
        flex: 1 1 50%;
        border: none;
        outline: none;
        resize: none;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
        line-height: 1.65;
        padding: 16px 20px 80px;
      }
      .divider {
        width: 1px;
        background: var(--border);
        flex: none;
      }
      body[data-mode='preview'] textarea,
      body[data-mode='preview'] .divider {
        display: none;
      }
      body[data-mode='source'] iframe.preview,
      body[data-mode='source'] .divider {
        display: none;
      }
      body[data-mode='source'] textarea {
        flex: 1;
      }
      body[data-mode='preview'] iframe.preview {
        flex: 1;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 7px 13px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
    </style>
  </head>
  <body data-mode="preview">
    <div class="panes">
      <!-- 预览 iframe 由脚本在内容就绪时创建，避免先提交一个空白文档 -->
      <div class="divider"></div>
      <textarea id="source" spellcheck="false"></textarea>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const PREF_MODE = 'html-viewer:defaultMode';
      const PREF_SCRIPTS = 'html-viewer:allowScripts';

      const state = {
        meta: null,
        original: '',
        content: '',
        dirty: false,
        mode: 'preview',
        allowScripts: false,
      };

      const $ = (id) => document.getElementById(id);

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      /** 预览 iframe 实例（懒创建，见 renderPreview）。 */
      let previewFrame = null;

      /**
       * 创建预览 iframe：sandbox / srcdoc 在未连接 DOM 时写入，
       * 插入后首次导航即为内容文档，不再经历 about:blank → srcdoc 的二次导航。
       *
       * 注意：sandbox="" 会让文档成为 opaque origin，站点隔离下 iframe 运行在独立
       * 渲染进程。若先提交 about:blank 再导航到内容（跨进程 surface 交接），首帧
       * 可能不会被合成器提交，表现为预览区一直空白。因此必须保持「首导航即内容」。
       */
      function createPreviewFrame(content, allowScripts) {
        const frame = document.createElement('iframe');
        frame.className = 'preview';
        frame.id = 'preview';
        frame.setAttribute('sandbox', allowScripts ? 'allow-scripts' : '');
        frame.setAttribute('referrerpolicy', 'no-referrer');
        frame.srcdoc = content;
        const panes = document.querySelector('.panes');
        panes.insertBefore(frame, panes.firstChild);
        return frame;
      }

      function renderPreview() {
        if (!previewFrame) {
          // 无内容时不创建：避免一个空白文档先于内容提交
          if (!state.content) return;
          previewFrame = createPreviewFrame(state.content, state.allowScripts);
          return;
        }
        previewFrame.setAttribute(
          'sandbox',
          state.allowScripts ? 'allow-scripts' : '',
        );
        previewFrame.srcdoc = state.content;
      }

      function reportState() {
        const bus = window.extension.bus;
        bus.send({
          type: 'actionState',
          id: 'layout-switch',
          value: state.mode,
        });
        bus.send({
          type: 'actionState',
          id: 'toggle-scripts',
          value: state.allowScripts ? 'on' : 'off',
        });
      }

      function setMode(mode) {
        state.mode = mode;
        document.body.dataset.mode = mode;
        reportState();
        if (mode !== 'source') renderPreview();
      }

      function cycleMode() {
        setMode(
          state.mode === 'preview'
            ? 'split'
            : state.mode === 'split'
              ? 'source'
              : 'preview',
        );
      }

      function toggleScripts() {
        state.allowScripts = !state.allowScripts;
        try {
          localStorage.setItem(PREF_SCRIPTS, state.allowScripts ? '1' : '0');
        } catch {
          /* ignore */
        }
        reportState();
        if (state.mode !== 'source') renderPreview();
      }

      function setDirty(dirty, force = false) {
        if (!force && state.dirty === dirty) return;
        state.dirty = dirty;
        window.extension.bus.send({ type: 'dirty', dirty });
      }

      function applyContent(payload) {
        state.meta = payload.meta;
        state.content = payload.content ?? '';
        state.original = state.content;
        $('source').value = state.content;
        renderPreview();
        setDirty(false, true);
      }

      const bus = window.extension.bus;
      const ura = window.extension.ura;
      const sessionId = new URLSearchParams(location.search).get('session');

      bus.on((msg) => {
        if (msg.type === 'content') applyContent(msg.payload);
        else if (msg.type === 'theme') applyTheme(msg.theme);
        else if (msg.type === 'action') {
          if (msg.id === 'layout-switch') cycleMode();
          else if (msg.id === 'toggle-scripts') toggleScripts();
          else if (msg.id === 'save') void save();
        }
      });

      // ── 交互 ─────────────────────────────────────────────

      let previewTimer = 0;
      $('source').addEventListener('input', (e) => {
        state.content = e.target.value;
        setDirty(state.content !== state.original);
        if (state.mode === 'split') {
          clearTimeout(previewTimer);
          previewTimer = setTimeout(renderPreview, 500);
        }
      });

      async function save() {
        if (!state.meta || !state.dirty) return;
        try {
          const result = await ura.page.save(sessionId, state.content);
          if (!result.ok) {
            toast('内容已被外部修改：请重新加载后再保存', true);
            return;
          }
          state.original = state.content;
          setDirty(false);
          toast('已保存');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
      }

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          void save();
        }
      });

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 2200);
      }

      // ── 启动 ─────────────────────────────────────────────

      try {
        const savedMode = localStorage.getItem(PREF_MODE);
        state.allowScripts = localStorage.getItem(PREF_SCRIPTS) === '1';
        setMode(
          savedMode === 'split' || savedMode === 'source'
            ? savedMode
            : 'preview',
        );
      } catch {
        setMode('preview');
      }
      bus.loaded();
    </script>
  </body>
</html>
