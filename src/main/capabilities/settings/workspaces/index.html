<!doctype html>
<!--
  工作区（设置能力页）。
  数据面：app:workspaces.list / switch / pick + app:storage.open（打开目录）。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作区</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --soft: #fafafa;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --soft: #1c1e1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        overflow: auto;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      header .grow {
        flex: 1;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .card {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }
      .item:last-child {
        border-bottom: none;
      }
      .item.current {
        background: rgba(79, 107, 237, 0.05);
      }
      .item .body {
        flex: 1;
        min-width: 0;
      }
      .item .name {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .item .name b {
        font-size: 13px;
        font-weight: 600;
      }
      .path {
        margin-top: 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
      }
      .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 999px;
        color: var(--accent);
        background: rgba(79, 107, 237, 0.1);
      }
      .badge.warn {
        color: #dc2626;
        background: rgba(220, 38, 38, 0.1);
      }
      .item .time {
        flex: none;
        font-size: 11px;
        color: var(--muted);
      }
      .item .actions {
        flex: none;
        display: flex;
        gap: 6px;
      }
      .empty {
        padding: 22px 12px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="grow">
          <h1>工作区</h1>
          <p>
            每个工作区一份独立现场（会话 / 设置 /
            界面状态）。切换工作区是原子换代：
            资源网关、会话域、技能与浏览器策略全部重绑。
          </p>
        </div>
        <button class="primary" id="pick">打开工作区…</button>
      </header>

      <div class="card" id="list"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const state = { workspaces: [], busy: '' };
      const invoke = (cmd, payload) => window.extension.invoke(cmd, payload);
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );

      function fmtTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return (
          d.getFullYear() +
          '/' +
          String(d.getMonth() + 1).padStart(2, '0') +
          '/' +
          String(d.getDate()).padStart(2, '0') +
          ' ' +
          String(d.getHours()).padStart(2, '0') +
          ':' +
          String(d.getMinutes()).padStart(2, '0')
        );
      }

      function render() {
        if (state.workspaces.length === 0) {
          $('list').innerHTML =
            '<div class="empty">尚未注册工作区。点右上「打开工作区…」选择目录。</div>';
          return;
        }
        $('list').innerHTML = state.workspaces
          .map((ws) => {
            const busy = state.busy === ws.path;
            return (
              '<div class="item' +
              (ws.current ? ' current' : '') +
              '">' +
              '<div class="body">' +
              '<div class="name"><b>' +
              esc(ws.name) +
              '</b>' +
              (ws.current ? '<span class="badge">当前</span>' : '') +
              (!ws.exists ? '<span class="badge warn">目录不存在</span>' : '') +
              '</div>' +
              '<div class="path" title="' +
              esc(ws.path) +
              '">' +
              esc(ws.path) +
              ' · wsId ' +
              esc(ws.wsId) +
              '</div>' +
              '</div>' +
              '<span class="time">最近 ' +
              fmtTime(ws.lastOpenedAt) +
              '</span>' +
              '<span class="actions">' +
              (!ws.current && ws.exists
                ? '<button data-switch="' +
                  esc(ws.path) +
                  '"' +
                  (busy ? ' disabled' : '') +
                  '>' +
                  (busy ? '切换中…' : '切换') +
                  '</button>'
                : '') +
              '<button data-open="' +
              esc(ws.path) +
              '">打开目录</button>' +
              '</span>' +
              '</div>'
            );
          })
          .join('');
      }

      async function refresh() {
        try {
          state.workspaces = await invoke('app:workspaces.list');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
        render();
      }

      async function switchTo(path) {
        state.busy = path;
        render();
        try {
          await invoke('app:workspaces.switch', { path });
          toast('已切换工作区');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        } finally {
          state.busy = '';
          await refresh();
        }
      }

      $('pick').onclick = async () => {
        try {
          const dir = await invoke('app:workspaces.pick');
          if (dir) await switchTo(dir);
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
      };

      $('list').addEventListener('click', (e) => {
        const sw = e.target.closest('[data-switch]');
        if (sw) return void switchTo(sw.dataset.switch);
        const open = e.target.closest('[data-open]');
        if (open) {
          void invoke('app:storage.open', { path: open.dataset.open }).catch(
            (err) =>
              toast(err && err.message ? err.message : String(err), true),
          );
        }
      });

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 2600);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      void refresh();
    </script>
  </body>
</html>
