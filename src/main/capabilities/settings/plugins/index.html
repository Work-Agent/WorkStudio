<!doctype html>
<!--
  WorkStudio 插件页（设置能力页）。
  数据面：window.appBridge（/plugins/installed / runtime / catalog / install / remove）。
  来源：zip（带 sha256）/ 本地 zip / 本地路径；本地 zip 与远程 zip 解压安装，
  本地目录直接加载；支持拖入 zip 或文件夹安装。安装 / 卸载即时生效。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkStudio 插件</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --input-bg: #ffffff;
        --danger: #dc2626;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --input-bg: #1c1e1f;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        overflow: auto;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .install-row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .install-row input {
        flex: 1;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--fg);
        border-radius: 7px;
        padding: 8px 11px;
        font-size: 12px;
        outline: none;
      }
      .install-row input:focus {
        border-color: var(--accent);
      }
      button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        border-radius: 7px;
        padding: 7px 14px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button.danger {
        color: var(--danger);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .section-title {
        margin: 22px 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 8px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .card .name {
        font-size: 13px;
        font-weight: 600;
      }
      .card .meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        word-break: break-all;
      }
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
      }
      .desc {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .empty {
        padding: 14px 2px;
        color: var(--muted);
        font-size: 12px;
      }
      .hint {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(12px);
        background: var(--fg);
        color: var(--panel);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.18s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: var(--danger);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>文档插件</h1>
        <p>管理资料的阅读、编辑与生成能力。文档仍从左侧资料列表打开。</p>
      </header>
      <div id="install-task" aria-label="插件安装任务" hidden></div>
      <div class="section-title">已安装与加载</div>
      <div id="plugins"></div>
      <div class="section-title">安装插件</div>
      <label for="source" class="hint">安装包链接、本地 zip 或插件目录</label>
      <div class="install-row">
        <input
          id="source"
          type="text"
          placeholder="安装包链接需包含 #sha256=…；也可拖入本地文件"
          autocomplete="off"
        /><button id="install" class="primary">安装</button>
      </div>
      <p class="hint">本地目录直接加载；远程安装包需要完整校验信息。</p>
      <details id="discovery" style="margin-top: 24px">
        <summary>发现插件</summary>
        <label for="catalog-url" class="hint">插件目录地址</label>
        <div class="install-row">
          <input
            id="catalog-url"
            type="text"
            placeholder="PLUGINS.md 地址"
            autocomplete="off"
          /><button id="catalog-refresh">刷新目录</button>
        </div>
        <div class="hint" id="catalog-meta"></div>
        <div id="catalog-list"></div>
      </details>
      <details style="margin-top: 24px">
        <summary>其他安装来源与高级信息</summary>
        <div id="sources"></div>
        <p class="hint">
          远程 zip 保留 sha256
          校验；本地目录不会复制或自动安装依赖。安装包由应用插件目录管理。
        </p>
      </details>
    </div>
    <div class="toast" id="toast"></div>

    <!-- 构建期内联可安装清单；开发模式保留空槽位，由 IPC 回退。 -->
    <script id="plugin-registry" type="application/json">
      []
    </script>

    <script>
      const app = window.appBridge;
      async function peek(path) {
        if (!app) throw new Error('app bridge unavailable');
        return app.peek(path);
      }
      async function call(path, input) {
        if (!app) throw new Error('app bridge unavailable');
        const result = await app.call(path, input);
        if (!result.ok) throw new Error(result.error.message);
        return result.data;
      }
      const shortPath = (value) => window.pathDisplay?.format(value) ?? value;
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );

      let sources = [];
      let loaded = [];
      let installTask = null;
      let catalog = [];
      let catalogUrl = '';
      let catalogMeta = '';
      let catalogError = '';
      let busy = false;

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => (el.className = 'toast'), 2400);
      }

      function renderSources() {
        const el = $('sources');
        if (sources.length === 0) {
          el.innerHTML = '<div class="empty">清单为空。</div>';
          return;
        }
        el.innerHTML = sources
          .map((p) => {
            const title = shortPath(p.label || p.name || p.path || p.source);
            const installed = Boolean(p.name);
            const action = installed
              ? '<button class="danger" data-remove="' +
                esc(p.source) +
                '"' +
                (busy ? ' disabled' : '') +
                '>' +
                (busy ? '处理中…' : '卸载') +
                '</button>'
              : '<button data-install="' +
                esc(p.source) +
                '"' +
                (busy ? ' disabled' : '') +
                '>' +
                (busy ? '处理中…' : '安装') +
                '</button>';
            return (
              '<div class="card"><div>' +
              '<div class="name">' +
              esc(title) +
              '<span class="badge">' +
              esc(installed ? '已安装' : p.type) +
              '</span></div>' +
              '<div class="meta">' +
              esc(shortPath(p.source)) +
              '</div></div>' +
              action +
              '</div>'
            );
          })
          .join('');
      }

      function renderCatalog() {
        const el = $('catalog-list');
        if (catalogError) {
          el.innerHTML =
            '<div class="empty">目录读取失败：' + esc(catalogError) + '</div>';
        } else if (catalog.length === 0) {
          el.innerHTML = '<div class="empty">目录为空。</div>';
        } else {
          el.innerHTML = catalog
            .map((entry) => {
              const installed =
                sources.some(
                  (item) =>
                    item.source === entry.source || item.name === entry.id,
                ) || loaded.some((item) => item.id === entry.id);
              return (
                '<div class="card"><div style="min-width:0">' +
                '<div class="name">' +
                esc(entry.name) +
                '<span class="badge">' +
                esc(entry.category) +
                '</span></div>' +
                (entry.description
                  ? '<p class="desc">' + esc(entry.description) + '</p>'
                  : '') +
                '<div class="meta">' +
                esc(entry.id + ' · ' + entry.source) +
                (entry.tags.length ? ' · ' + esc(entry.tags.join(', ')) : '') +
                '</div></div>' +
                '<button data-catalog-install="' +
                esc(entry.source) +
                '"' +
                (installed || busy ? ' disabled' : '') +
                '>' +
                (installed ? '已安装' : '安装') +
                '</button></div>'
              );
            })
            .join('');
        }
        $('catalog-meta').textContent = catalogMeta;
        if ($('catalog-url') && !$('catalog-url').value) {
          $('catalog-url').value = catalogUrl;
        }
      }

      function renderPlugins() {
        const el = $('plugins');
        if (loaded.length === 0) {
          el.innerHTML = '<div class="empty">当前没有已加载的插件。</div>';
          return;
        }
        el.innerHTML = loaded
          .map(
            (p) =>
              '<div class="card"><div style="min-width:0">' +
              '<div class="name">' +
              esc(p.name) +
              '<span class="badge">v' +
              esc(p.version) +
              '</span></div>' +
              (p.description
                ? '<p class="desc">' + esc(p.description) + '</p>'
                : '') +
              '<div class="meta">' +
              (p.loaded === false ? '已安装 · 加载失败 · ' : '已加载 · ') +
              esc(p.id) +
              ' · ' +
              (p.extensionCount > 0 ? p.extensionCount + ' 个视图' : '无视图') +
              '</div>' +
              (p.error
                ? '<p role="alert" class="hint">' + esc(p.error) + '</p>'
                : '') +
              '</div><div class="actions">' +
              (p.hasConfig
                ? '<button data-plugin-settings="' +
                  esc(p.id) +
                  '" ' +
                  (p.loaded === false ? 'disabled' : '') +
                  '>配置</button>'
                : '<span class="hint">无需配置</span>') +
              sources
                .filter((source) => source.name === p.id)
                .map(
                  (source) =>
                    '<button data-load="' +
                    esc(source.source) +
                    '">重新加载</button><button class="danger" data-remove="' +
                    esc(source.source) +
                    '">卸载</button>',
                )
                .join('') +
              '</div></div>',
          )
          .join('');
      }

      function bakedRegistry() {
        const el = $('plugin-registry');
        if (!el) return [];
        try {
          const data = JSON.parse(el.textContent || '[]');
          return Array.isArray(data) ? data : [];
        } catch {
          return [];
        }
      }

      function mergeSources(registry, runtime) {
        const live = new Map(runtime.map((item) => [item.source, item]));
        const merged = registry.map((item) => {
          const current = live.get(item.source);
          live.delete(item.source);
          return current
            ? { ...item, ...current, label: item.label || current.label }
            : { ...item };
        });
        return merged.concat([...live.values()]);
      }

      async function load() {
        let runtime = [];
        try {
          runtime = (await peek('/plugins/installed')) || [];
        } catch {
          runtime = [];
        }
        sources = mergeSources(bakedRegistry(), runtime);
        try {
          loaded = (await peek('/plugins/runtime')) || [];
        } catch {
          loaded = [];
        }
        renderSources();
        renderPlugins();
        renderCatalog();
      }

      async function loadCatalog(url) {
        try {
          const res = await call(
            '/plugins/catalog/refresh',
            url ? { url } : {},
          );
          catalog = res.entries || [];
          catalogUrl = res.url || '';
          catalogError = res.error || '';
          catalogMeta =
            (res.stale ? '缓存（拉取失败）' : '已更新') +
            (res.fetchedAt
              ? ' · ' + new Date(res.fetchedAt).toLocaleString()
              : '') +
            (catalogError ? ' · ' + catalogError : '');
        } catch (e) {
          catalog = [];
          catalogError = e && e.message ? e.message : String(e);
          catalogMeta = '';
        }
        renderCatalog();
      }

      /** 已加载插件（当前启动）：热装卸会改变运行时列表，装 / 卸后同步。 */
      async function refreshLoaded() {
        try {
          loaded = (await peek('/plugins/runtime')) || [];
        } catch {
          loaded = [];
        }
        renderPlugins();
      }

      async function install(source) {
        const value = String(source ?? $('source').value).trim();
        if (!value || busy) return;
        busy = true;
        renderSources();
        try {
          await call('/plugins/install', { source: value });
          sources = (await peek('/plugins/installed')) || [];
          $('source').value = '';
          renderCatalog();
          await refreshLoaded();
          toast(
            installTask?.loaded
              ? '插件已安装并加载'
              : '安装任务已更新，请查看加载状态',
          );
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        } finally {
          busy = false;
          renderSources();
        }
      }

      async function remove(source) {
        if (busy) return;
        busy = true;
        renderSources();
        try {
          await call('/plugins/remove', { source });
          sources = (await peek('/plugins/installed')) || [];
          await refreshLoaded();
          toast('已移除 ' + source + '，已即时生效');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        } finally {
          busy = false;
          renderSources();
        }
      }

      $('plugins').addEventListener('click', (e) => {
        const settingsButton = e.target.closest('[data-plugin-settings]');
        if (settingsButton)
          void call('/plugins/open', {
            pluginId: settingsButton.dataset.pluginSettings,
            surface: 'settings',
          }).catch((error) => toast(error.message, true));
        const loadButton = e.target.closest('[data-load]');
        const removeButton = e.target.closest('[data-remove]');
        if (loadButton)
          void call('/plugins/reload', { source: loadButton.dataset.load })
            .then(() => load())
            .catch((error) => toast(error.message, true));
        if (removeButton) void remove(removeButton.dataset.remove);
      });
      $('install').onclick = () => void install();
      $('source').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') void install();
      });

      // ─── 拖拽安装（zip 文件 / 插件文件夹） ─────────────
      function filePathOf(file) {
        try {
          return window.extension?.filePath?.(file) || '';
        } catch {
          return '';
        }
      }
      document.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      document.addEventListener('drop', (e) => {
        e.preventDefault();
        if (busy) return;
        const paths = [...(e.dataTransfer?.files ?? [])]
          .map(filePathOf)
          .filter(Boolean);
        if (paths.length === 0) return;
        void (async () => {
          for (const p of paths) {
            $('source').value = p;
            await install();
          }
        })();
      });

      $('sources').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-remove]');
        if (btn) void remove(btn.dataset.remove);
        const installBtn = e.target.closest('[data-install]');
        if (installBtn) void install(installBtn.dataset.install);
      });
      $('catalog-refresh').onclick = () => {
        void loadCatalog($('catalog-url').value.trim());
      };
      $('catalog-list').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-catalog-install]');
        if (!btn) return;
        $('source').value = btn.dataset.catalogInstall;
        void install();
      });

      function renderInstallTask(task) {
        installTask = task;
        const el = $('install-task');
        el.hidden = !task;
        if (!task) return;
        busy = ['running', 'cancelling'].includes(task.status);
        $('install').disabled = busy;
        const phases = {
          download: task.sourceType === 'local' ? '读取安装包' : '下载',
          verify: '校验',
          install: '安装',
          load: '加载',
        };
        const index = Object.keys(phases).indexOf(task.phase);
        const steps = Object.entries(phases)
          .map(
            ([phase, name], i) =>
              '<span style="color:' +
              (phase === task.phase ? 'var(--accent)' : 'var(--muted)') +
              '">' +
              (i < index || task.status === 'done' ? '✓ ' : '○ ') +
              name +
              '</span>',
          )
          .join('　');
        const progress =
          task.status === 'running'
            ? '<progress aria-label="安装进度" max="100" ' +
              (task.phase === 'download' && task.total
                ? 'value="' +
                  Math.min(
                    100,
                    Math.floor((task.received / task.total) * 100),
                  ) +
                  '"'
                : '') +
              ' style="width:100%;height:6px;margin:12px 0;accent-color:var(--accent)"></progress>'
            : '';
        const bytesLabel = (value) =>
          value < 1024
            ? value + ' B'
            : value < 1024 * 1024
              ? (value / 1024).toFixed(1) + ' KB'
              : (value / 1024 / 1024).toFixed(1) + ' MB';
        const count =
          task.phase === 'download' && task.received
            ? '<p class="hint">' +
              bytesLabel(task.received) +
              (task.total ? ' / ' + bytesLabel(task.total) : ' · 总大小未知') +
              '</p>'
            : '';
        const integrity =
          task.phase === 'verify' && /sha256/.test(task.error || '');
        let actions = busy
          ? '<button data-install-cancel ' +
            (task.status === 'cancelling' ? 'disabled' : '') +
            '>' +
            (task.status === 'cancelling' ? '等待取消确认' : '取消安装') +
            '</button>'
          : ['failed', 'cancelled'].includes(task.status)
            ? (integrity
                ? ''
                : '<button data-install-retry class="primary">' +
                  (task.installed && !task.loaded ? '重新加载' : '重试安装') +
                  '</button>') + '<button data-install-source>更换来源</button>'
            : '';
        el.innerHTML =
          '<section class="card" style="display:block;margin:22px 0;border-left:2px solid ' +
          (task.status === 'failed' ? 'var(--danger)' : 'var(--accent)') +
          '"><h3>' +
          (task.installed ? esc(task.label) : '插件安装') +
          '</h3><p class="hint">' +
          steps +
          '</p><div ' +
          (task.status === 'failed'
            ? 'role="alert"'
            : 'role="status" aria-live="polite"') +
          '>' +
          esc(task.message) +
          '</div>' +
          progress +
          count +
          '<p class="hint">第 ' +
          task.attempt +
          ' 次尝试 · ' +
          (task.loaded
            ? '已安装 · 已加载'
            : task.installed
              ? '已安装 · 未加载'
              : '尚未安装完成') +
          '</p><div class="actions" style="display:flex;gap:8px;flex-wrap:wrap">' +
          actions +
          '</div><details style="margin-top:14px"><summary>阶段与错误详情</summary><p class="meta" style="overflow-wrap:anywhere">来源：' +
          esc(shortPath(task.source)) +
          '<br>' +
          esc(task.error || '当前阶段：' + phases[task.phase]) +
          '</p></details></section>';
        renderSources();
      }
      $('install-task').addEventListener('click', async (e) => {
        if (e.target.closest('[data-install-cancel]')) {
          const response = await call('/dialogs/ask', {
            dialogType: 'select',
            title: '取消插件安装？',
            message:
              '取消会等待当前步骤结束。已经安装的文件会保留，并单独显示加载状态。',
            options: ['确认取消'],
          });
          if (!response.cancelled && response.value === '确认取消')
            void call('/plugins/install/cancel').catch((e) =>
              toast(e.message, true),
            );
        }
        if (e.target.closest('[data-install-retry]'))
          void call('/plugins/install/retry').catch((e) =>
            toast(e.message, true),
          );
        if (e.target.closest('[data-install-source]')) $('source').focus();
      });
      app.on((frame) => {
        if (frame.type !== 'state') return;
        if (frame.path === '/plugins/task') renderInstallTask(frame.value);
        if (
          frame.path === '/plugins/installed' ||
          frame.path === '/plugins/runtime'
        )
          void load();
      });
      void app.watch([
        '/plugins/task',
        '/plugins/installed',
        '/plugins/runtime',
      ]);
      void peek('/plugins/task').then(renderInstallTask);
      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      void load();
      $('discovery').addEventListener('toggle', () => {
        if ($('discovery').open && !catalogMeta) void loadCatalog();
      });
    </script>
  </body>
</html>
