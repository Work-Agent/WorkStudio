<!doctype html>
<!--
  存储与数据（设置能力页）。
  数据面：app:storage.view / open + app:settings.setGlobal（sessionDir）。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>存储与数据</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --input-bg: #ffffff;
        --soft: #fafafa;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --input-bg: #1c1e1f;
        --soft: #1c1e1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        overflow: auto;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0;
        margin-top: 16px;
        overflow: hidden;
      }
      .card h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        padding: 10px 14px;
        background: var(--soft);
        border-bottom: 1px solid var(--border);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--border);
      }
      .row:last-child {
        border-bottom: none;
      }
      .row .label {
        flex: none;
        width: 168px;
        font-size: 12.5px;
      }
      .row .label span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .row .path {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
      }
      button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        border-radius: 6px;
        padding: 4px 11px;
        font-size: 11.5px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input[type='text'] {
        flex: 1;
        min-width: 0;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .versions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 12px 14px;
      }
      .versions div {
        display: flex;
        justify-content: space-between;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--soft);
        font-size: 12px;
      }
      .versions b {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 500;
      }
      .foot {
        margin: 14px 2px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>存储与数据</h1>
        <p>
          全部应用数据落在应用自持目录（与用户全局 pi
          隔离，不污染工作区）；会话与 ui-state 按工作区隔离；写入一律原子替换。
        </p>
      </header>

      <section class="card" id="card-workspace"></section>
      <section class="card" id="card-config"></section>
      <section class="card" id="card-sessions"></section>
      <section class="card" id="card-plugins"></section>
      <section class="card" id="card-versions"></section>

      <p class="foot">
        会话目录变更会立刻以新目录重建会话域（当前会话回到新任务态）；旧目录中的会话文件不会移动。
      </p>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const state = { view: null, editing: false, saving: false };
      const invoke = (cmd, payload) => window.extension.invoke(cmd, payload);
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );

      const ROOT_SOURCES = {
        flag: '命令行 --data-dir',
        env: '环境变量 WA_DATA_DIR',
        pointer: '界面设置',
        portable: '便携目录',
        default: '系统默认位置',
      };

      const rootRow = (path, source) =>
        '<div class="row"><div class="label">数据根<span>' +
        esc(ROOT_SOURCES[source] || source || '默认') +
        ' · 重启后生效</span></div><div class="path" title="' +
        esc(path) +
        '">' +
        esc(path) +
        '</div><button data-set-root="1">更改…</button></div>';

      const pathRow = (label, hint, path) =>
        '<div class="row"><div class="label">' +
        esc(label) +
        (hint ? '<span>' + esc(hint) + '</span>' : '') +
        '</div><div class="path" title="' +
        esc(path) +
        '">' +
        esc(path) +
        '</div><button data-open="' +
        esc(path) +
        '">打开</button></div>';

      function render() {
        const v = state.view;
        if (!v) return;
        $('card-workspace').innerHTML =
          '<h3>工作区</h3>' +
          pathRow('当前工作区', 'wsId ' + v.workspaceId, v.workspacePath) +
          pathRow(
            '工作区设置',
            'project 层 settings.json',
            v.workspaceSettings,
          ) +
          pathRow(
            '界面状态',
            '主题 / 栏宽 / 打开集合 / 会话现场',
            v.uiStateFile,
          ) +
          pathRow('站点快照', '白名单域归档（随内容版本管理）', v.sitesDir);

        $('card-config').innerHTML =
          '<h3>配置与凭证</h3>' +
          rootRow(v.dataRoot, v.dataRootSource) +
          pathRow('全局设置', 'settings.json', v.globalSettings) +
          pathRow('模型目录', '自定义供应商与模型', v.modelsJson) +
          pathRow('凭证库', 'API Key / OAuth（值不出主进程）', v.authJson);

        const configured = v.sessionsDirConfigured;
        $('card-sessions').innerHTML =
          '<h3>会话存储</h3>' +
          pathRow(
            '会话目录（生效）',
            configured ? 'settings.json: sessionDir' : '默认位置',
            v.sessionsDir,
          ) +
          pathRow('默认会话目录', '未配置时使用', v.defaultSessionsDir) +
          '<div class="row"><div class="label">自定义会话目录<span>' +
          (configured ? '当前：' + esc(configured) : '相对路径按工作区解析') +
          '</span></div>' +
          (state.editing
            ? '<input type="text" id="dir" placeholder="绝对路径，或相对工作区（如 .pi/sessions）；留空 = 默认" value="' +
              esc(configured || '') +
              '" />' +
              '<button class="primary" id="dir-save"' +
              (state.saving ? ' disabled' : '') +
              '>' +
              (state.saving ? '保存中…' : '保存并切换') +
              '</button>' +
              '<button id="dir-cancel">取消</button>'
            : '<div class="path">' +
              (configured
                ? esc(configured)
                : '默认（应用目录内，按工作区隔离）') +
              '</div><button data-edit-dir="1">修改</button>' +
              (configured
                ? '<button data-reset-dir="1"' +
                  (state.saving ? ' disabled' : '') +
                  '>恢复默认</button>'
                : '')) +
          '</div>';

        $('card-plugins').innerHTML =
          '<h3>插件与诊断</h3>' +
          v.pluginsDirs.map((d) => pathRow('插件根', null, d)).join('') +
          pathRow('启动日志', '每次启动重建', v.bootLog);

        $('card-versions').innerHTML =
          '<h3>版本</h3><div class="versions">' +
          Object.entries(v.versions)
            .map(
              ([k, ver]) =>
                '<div><span>' +
                esc(k) +
                '</span><b>' +
                esc(ver || '—') +
                '</b></div>',
            )
            .join('') +
          '</div>';
      }

      async function refresh() {
        try {
          state.view = await invoke('app:storage.view');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
        render();
      }

      async function saveSessionDir(value) {
        state.saving = true;
        render();
        try {
          await invoke('app:settings.setGlobal', {
            path: 'sessionDir',
            value: value === '' ? null : value,
          });
          state.editing = false;
          toast('已更新会话目录');
          await refresh();
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        } finally {
          state.saving = false;
          render();
        }
      }

      document.addEventListener('click', (e) => {
        const open = e.target.closest('[data-open]');
        if (open) {
          void invoke('app:storage.open', { path: open.dataset.open }).catch(
            (err) =>
              toast(err && err.message ? err.message : String(err), true),
          );
          return;
        }
        if (e.target.closest('[data-set-root]')) {
          void invoke('app:storage.setDataRoot')
            .then(() => refresh())
            .catch((err) =>
              toast(err && err.message ? err.message : String(err), true),
            );
          return;
        }
        if (e.target.closest('[data-edit-dir]')) {
          state.editing = true;
          render();
          document.getElementById('dir')?.focus();
          return;
        }
        if (e.target.closest('[data-reset-dir]')) {
          void saveSessionDir('');
          return;
        }
        if (e.target.closest('#dir-save')) {
          const value = document.getElementById('dir').value.trim();
          void saveSessionDir(value);
          return;
        }
        if (e.target.closest('#dir-cancel')) {
          state.editing = false;
          render();
        }
      });

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 2600);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      void refresh();
    </script>
  </body>
</html>
