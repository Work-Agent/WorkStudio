<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浏览器 · 白名单</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --panel: #fff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --danger: #dc2626;
        --hover: rgba(127, 127, 127, 0.1);
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --danger: #f87171;
        --hover: rgba(255, 255, 255, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        padding: 32px 36px;
        font:
          13px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Noto Sans',
          Helvetica,
          Arial,
          sans-serif;
      }
      .wrap {
        max-width: 720px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 18px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 22px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        height: 34px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font: inherit;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      button {
        height: 34px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:hover {
        background: var(--hover);
      }
      button.primary:hover {
        filter: brightness(1.06);
        background: var(--accent);
      }
      ul {
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
      }
      li:hover {
        background: var(--hover);
      }
      li img {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      li .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li button {
        border: none;
        color: var(--muted);
        padding: 0 6px;
        height: 26px;
      }
      li button:hover {
        color: var(--danger);
        background: transparent;
      }
      .empty {
        color: var(--muted);
        margin-top: 16px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin-top: 14px;
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: var(--fg);
        color: var(--bg);
        padding: 8px 14px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.18s;
      }
      .toast.show {
        opacity: 1;
      }
      .toast.error {
        background: var(--danger);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>网站资料采集范围</h1>
      <p class="sub">
        允许归档的网站按当前工作区保存，域名规则包含子域名。添加域名不会自动访问网站；名单外页面作为临时网页打开。
      </p>
      <div class="card">
        <div class="row">
          <input
            id="domain"
            placeholder="添加域名，例如 example.com"
            spellcheck="false"
          />
          <button class="primary" id="add">添加</button>
        </div>
        <ul id="list"></ul>
        <div class="empty" id="empty" hidden>白名单为空。</div>
        <p class="hint">
          列表中的域名才会归档；名单外页面只作为临时网页标签存在。白名单按工作区保存。
        </p>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      const bridge = window.appBridge;
      async function call(path, input) {
        const result = await bridge.call(path, input);
        if (!result.ok) throw new Error(result.error.message);
        return result.data;
      }
      async function allowlistPath(suffix = '') {
        const workspace = await bridge.peek('/workspaces/current');
        if (!workspace) throw new Error('workspace is not ready');
        return `/workspaces/${workspace.id}/sites/allowlist${suffix}`;
      }

      const $ = (id) => document.getElementById(id);
      let domains = [];

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        setTimeout(() => (el.className = 'toast'), 1800);
      }

      function render() {
        $('empty').hidden = domains.length > 0;
        $('list').innerHTML = domains
          .map(
            (domain) =>
              '<li><img src="https://' +
              domain +
              '/favicon.ico" alt="" onerror="this.style.visibility=\'hidden\'" />' +
              '<span class="name">' +
              domain +
              '</span>' +
              '<button data-domain="' +
              domain +
              '" title="移除">✕</button></li>',
          )
          .join('');
      }

      async function save(next) {
        await call(await allowlistPath('/set'), { list: next });
        domains = next;
        render();
      }

      $('add').onclick = async () => {
        const input = $('domain');
        const domain = input.value
          .trim()
          .toLowerCase()
          .replace(/^https?:\/\//, '')
          .replace(/\/.*$/, '');
        if (!domain || domains.includes(domain)) return;
        try {
          await save([...domains, domain]);
          input.value = '';
          window.extension.bus.send({ type: 'dirty', dirty: false });
          toast('已添加');
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
      };

      $('domain').addEventListener('input', () =>
        window.extension.bus.send({
          type: 'dirty',
          dirty: !!$('domain').value.trim(),
        }),
      );
      $('domain').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('add').click();
      });

      $('list').addEventListener('click', async (e) => {
        const button = e.target.closest('button[data-domain]');
        if (!button) return;
        try {
          await save(domains.filter((d) => d !== button.dataset.domain));
          toast('已移除');
        } catch (err) {
          toast(err && err.message ? err.message : String(err), true);
        }
      });

      (async () => {
        try {
          domains = (await bridge.peek(await allowlistPath())) || [];
        } catch {
          domains = [];
        }
        render();
      })();

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
    </script>
  </body>
</html>
