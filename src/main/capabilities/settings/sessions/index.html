<!doctype html>
<!--
  会话管理（设置能力页）。
  数据面：window.appBridge（/workspaces/:wsId/sessions/*；当前会话来自 sessions/current）。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会话管理</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --input-bg: #ffffff;
        --soft: #fafafa;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --input-bg: #1c1e1f;
        --soft: #1c1e1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        overflow: auto;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      header .grow {
        flex: 1;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 14px;
      }
      input[type='text'] {
        flex: 1;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12.5px;
        font-family: inherit;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button.danger {
        color: #dc2626;
      }
      html[data-theme='dark'] button.danger {
        color: #f87171;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .count {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .card {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        position: relative;
      }
      .item:last-child {
        border-bottom: none;
      }
      .item:hover {
        background: var(--soft);
      }
      .item.active {
        background: rgba(79, 107, 237, 0.06);
      }
      .item.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--accent);
        border-radius: 0 2px 2px 0;
      }
      .avatar {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--soft);
        border: 1px solid var(--border);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .item .body {
        flex: 1;
        min-width: 0;
      }
      .item .name {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .item .name b {
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        flex: none;
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 999px;
        color: var(--accent);
        background: rgba(79, 107, 237, 0.1);
      }
      .badge.live {
        color: #d97706;
        background: rgba(217, 119, 6, 0.12);
      }
      .item .preview {
        margin-top: 3px;
        font-size: 11.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item .time {
        flex: none;
        font-size: 11px;
        color: var(--muted);
      }
      .item .actions {
        flex: none;
        display: flex;
        gap: 6px;
      }
      .empty {
        padding: 22px 12px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="grow">
          <h1>会话历史</h1>
          <p>
            当前工作区的对话记录。关闭标签会保留历史；删除会话不会删除已经保存的文档成果。
          </p>
        </div>
        <button class="primary" id="new">新建会话</button>
      </header>

      <div class="row">
        <input type="text" id="q" placeholder="搜索会话（标题 / 预览）…" />
        <span class="count" id="count"></span>
      </div>

      <div class="card" id="list"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const state = { sessions: [], activePath: null, streaming: false, q: '' };
      const bridge = window.appBridge;
      async function call(path, input) {
        const result = await bridge.call(path, input);
        if (!result.ok) throw new Error(result.error.message);
        return result.data;
      }
      async function workspace() {
        const current = await bridge.peek('/workspaces/current');
        if (!current) throw new Error('workspace is not ready');
        return current;
      }
      const sessionPath = (path) => encodeURIComponent(path || '');
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );

      function fmtTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        const today = new Date();
        const sameDay =
          d.getFullYear() === today.getFullYear() &&
          d.getMonth() === today.getMonth() &&
          d.getDate() === today.getDate();
        return sameDay
          ? String(d.getHours()).padStart(2, '0') +
              ':' +
              String(d.getMinutes()).padStart(2, '0')
          : d.getMonth() +
              1 +
              '/' +
              d.getDate() +
              ' ' +
              String(d.getHours()).padStart(2, '0') +
              ':' +
              String(d.getMinutes()).padStart(2, '0');
      }

      function render() {
        const q = state.q.trim().toLowerCase();
        const list = state.sessions.filter(
          (s) =>
            !q ||
            (s.name || '').toLowerCase().includes(q) ||
            (s.preview || '').toLowerCase().includes(q),
        );
        $('count').textContent = list.length + ' / ' + state.sessions.length;
        if (list.length === 0) {
          $('list').innerHTML =
            '<div class="empty">' +
            (state.sessions.length === 0
              ? '还没有会话。点右上「新任务」开始。'
              : '没有匹配的会话。') +
            '</div>';
          return;
        }
        $('list').innerHTML = list
          .map((s) => {
            const active = s.path === state.activePath;
            const streaming = active && state.streaming;
            return (
              '<div class="item' +
              (active ? ' active' : '') +
              '" data-path="' +
              esc(s.path) +
              '">' +
              '<div class="avatar">' +
              esc((s.name || '?').trim().charAt(0).toUpperCase()) +
              '</div>' +
              '<div class="body">' +
              '<div class="name"><b>' +
              esc(s.name || '未命名会话') +
              '</b>' +
              (active ? '<span class="badge">当前</span>' : '') +
              (streaming ? '<span class="badge live">执行中</span>' : '') +
              '</div>' +
              '<div class="preview">' +
              esc((s.preview || '新任务').replace(/\s+/g, ' ').slice(0, 120)) +
              '</div>' +
              '</div>' +
              '<span class="time">' +
              fmtTime(s.createdAt) +
              '</span>' +
              '<span class="actions">' +
              (streaming
                ? '<button data-abort="1">停止</button>'
                : '<button data-rename="' +
                  esc(s.path) +
                  '">重命名</button>' +
                  '<button class="danger" data-delete="' +
                  esc(s.path) +
                  '">删除</button>') +
              '</span>' +
              '</div>'
            );
          })
          .join('');
      }

      async function refresh() {
        try {
          const current = await workspace();
          const [sessions, agent] = await Promise.all([
            bridge.peek(`/workspaces/${current.id}/sessions`),
            bridge.peek(`/workspaces/${current.id}/sessions/current`),
          ]);
          state.sessions = sessions || [];
          state.activePath = agent?.sessionFile ?? null;
          state.streaming = agent?.isStreaming === true;
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
        render();
      }

      $('new').onclick = async () => {
        try {
          await call(`/workspaces/${(await workspace()).id}/sessions/new`);
          toast('已开始新任务');
          await refresh();
        } catch (e) {
          toast(e && e.message ? e.message : String(e), true);
        }
      };

      $('q').addEventListener('input', (e) => {
        state.q = e.target.value;
        render();
      });

      $('list').addEventListener('click', async (e) => {
        const abort = e.target.closest('[data-abort]');
        if (abort) {
          e.stopPropagation();
          try {
            await call(
              `/workspaces/${(await workspace()).id}/sessions/current/abort`,
            );
            toast('已停止执行');
          } catch (err) {
            toast(err && err.message ? err.message : String(err), true);
          }
          return void refresh();
        }
        const rename = e.target.closest('[data-rename]');
        if (rename) {
          e.stopPropagation();
          const path = rename.dataset.rename;
          const currentName =
            state.sessions.find((s) => s.path === path)?.name ?? '';
          try {
            const response = await call('/dialogs/ask', {
              dialogType: 'input',
              title: '重命名会话',
              prefill: currentName,
              placeholder: '请输入会话名称',
            });
            if (response.cancelled || typeof response.value !== 'string')
              return;
            const next = response.value.trim();
            if (!next || next === currentName) return;
            const current = await workspace();
            await call(
              `/workspaces/${current.id}/sessions/${sessionPath(path)}/rename`,
              { name: next },
            );
            toast('已重命名');
          } catch (err) {
            toast(err && err.message ? err.message : String(err), true);
          }
          return void refresh();
        }
        const del = e.target.closest('[data-delete]');
        if (del) {
          e.stopPropagation();
          const path = del.dataset.delete;
          try {
            const name = state.sessions.find((s) => s.path === path)?.name;
            const response = await call('/dialogs/ask', {
              dialogType: 'confirm',
              title: '删除会话？',
              message: `删除“${name || '未命名会话'}”？会话文件将被移除，不可恢复。`,
            });
            if (response.cancelled || response.confirmed !== true) return;
            const current = await workspace();
            await call(
              `/workspaces/${current.id}/sessions/${sessionPath(path)}/delete`,
            );
            toast('已删除');
          } catch (err) {
            toast(err && err.message ? err.message : String(err), true);
          }
          return void refresh();
        }
        const item = e.target.closest('[data-path]');
        if (item) {
          try {
            const current = await workspace();
            await call(`/workspaces/${current.id}/sessions/current/open`, {
              sessionId: sessionPath(item.dataset.path),
            });
            await refresh();
          } catch (err) {
            toast(err && err.message ? err.message : String(err), true);
          }
        }
      });

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 2600);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      void refresh();
      // 执行态与激活位轮询（视图页无主进程推送面时的最简收敛）
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
