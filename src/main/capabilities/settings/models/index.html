<!doctype html>
<!--
  模型设置页（设置能力页）—— architecture.md §8 / §9。
  数据面：
    app:models.read       models.json 脱敏视图（自定义供应商 / 模型目录编辑）
    app:models.providers  供应商目录 + 凭证状态（内置 + 自定义；凭证值不回传）
    app:models.catalog    pi 组合后的模型目录（available = 供应商已认证）
    app:models.login      登录（api_key 直传 / oauth 交互在浮层完成）→ 写 auth.json
    app:models.logout     删除已存凭证
    app:agent.configure   默认模型 / 思考档位（即时生效 + settings 落盘）
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型设置</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --input-bg: #ffffff;
        --soft: #fafafa;
        --ok: #16a34a;
        --warn: #d97706;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --input-bg: #1c1e1f;
        --soft: #1c1e1f;
        --ok: #4ade80;
        --warn: #fbbf24;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        overflow: auto;
      }
      .wrap {
        max-width: 780px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-top: 16px;
      }
      .card h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .scope {
        font-weight: 400;
        font-size: 11px;
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .row .field {
        flex: 1 1 200px;
        min-width: 140px;
      }
      .field label {
        display: block;
        font-size: 12px;
        margin-bottom: 5px;
        color: var(--muted);
      }
      input[type='text'],
      input[type='number'],
      input[type='password'],
      select,
      textarea {
        width: 100%;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        font-family: inherit;
      }
      textarea {
        min-height: 58px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      button {
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button.danger {
        color: #dc2626;
      }
      html[data-theme='dark'] button.danger {
        color: #f87171;
      }
      button.mini {
        padding: 3px 8px;
        font-size: 11px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .status-line {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .status-line b {
        color: var(--fg);
      }
      .warn {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(79, 107, 237, 0.1);
        color: var(--accent);
        font-size: 12px;
      }
      .prov {
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-top: 10px;
        overflow: hidden;
      }
      .prov-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        background: var(--soft);
      }
      .prov-head .name {
        font-weight: 600;
        font-size: 12.5px;
      }
      .prov-head .meta {
        color: var(--muted);
        font-size: 11px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 10.5px;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .badge.ok {
        color: var(--ok);
        border-color: color-mix(in srgb, var(--ok) 35%, transparent);
        background: color-mix(in srgb, var(--ok) 10%, transparent);
      }
      .badge.off {
        color: var(--muted);
        border-color: var(--border);
        background: transparent;
      }
      .prov-body {
        padding: 14px;
        border-top: 1px solid var(--border);
      }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 12px 0 2px;
      }
      .section-label:first-child {
        margin-top: 0;
      }
      .models {
        margin-top: 12px;
        border-top: 1px dashed var(--border);
        padding-top: 10px;
      }
      .models h4 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        text-align: left;
        padding: 5px 6px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      td.actions {
        text-align: right;
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
        padding: 6px 0;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
      .foot {
        margin: 16px 2px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }
      .spinner {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -1px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>模型设置</h1>
        <p>
          内置供应商直接登录（凭证写入
          <code>auth.json</code>，不回显）；自定义端点写入
          <code>models.json</code>（保存前经 pi 真实加载校验，失败自动回滚）。
        </p>
      </header>

      <section class="card">
        <h3>
          当前默认模型 <span class="scope">会话默认 · settings.json</span>
        </h3>
        <div class="status-line" id="status"></div>
        <div class="row">
          <div class="field">
            <label>模型</label>
            <select id="pick-model"></select>
          </div>
          <div class="field">
            <label>思考档位</label>
            <select id="pick-thinking"></select>
          </div>
          <button class="primary" data-action="apply-model">应用</button>
        </div>
      </section>

      <section class="card">
        <h3>供应商 <span class="scope" id="prov-count"></span></h3>
        <div class="row">
          <div class="field">
            <label>筛选</label>
            <input
              type="text"
              id="prov-filter"
              placeholder="按名称 / id 过滤（如 anthropic、openai）"
            />
          </div>
          <label
            style="
              font-size: 12px;
              display: flex;
              gap: 6px;
              align-items: center;
              padding-bottom: 7px;
            "
          >
            <input type="checkbox" id="prov-only-ready" />仅显示已认证
          </label>
        </div>
        <div id="providers"></div>
      </section>

      <section class="card">
        <h3>新增自定义供应商</h3>
        <div class="row">
          <div class="field">
            <label>id（小写字母 / 数字 / 连字符）</label>
            <input type="text" id="new-id" placeholder="my-provider" />
          </div>
          <div class="field">
            <label>名称</label>
            <input type="text" id="new-name" placeholder="My Provider" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Base URL</label>
            <input
              type="text"
              id="new-base"
              placeholder="https://api.example.com/v1"
            />
          </div>
          <div class="field">
            <label>API 协议</label>
            <select id="new-api"></select>
          </div>
          <button class="primary" data-action="add-provider">添加</button>
        </div>
      </section>

      <p class="foot">
        API 协议：<code>openai-completions</code>（OpenAI 兼容，Ollama / LM
        Studio / vLLM）/ <code>openai-responses</code> /
        <code>anthropic-messages</code>。 登录状态来自 pi 凭证链（stored /
        runtime / environment）——环境变量提供的 凭证不会显示「退出登录」。
      </p>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const APIS = [
        'openai-completions',
        'openai-responses',
        'anthropic-messages',
      ];
      const state = {
        providers: [],
        catalog: [],
        custom: {},
        status: null,
        levels: [],
        busy: false,
        expanded: {},
      };

      const invoke = (cmd, payload) => window.extension.invoke(cmd, payload);
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      const num = (v) =>
        v == null || v === '' ? '' : Number(v).toLocaleString();
      const apiOptions = (selected) => {
        const list =
          APIS.includes(selected) || !selected ? APIS : [...APIS, selected];
        return list
          .map(
            (a) =>
              '<option value="' +
              a +
              '"' +
              (a === selected ? ' selected' : '') +
              '>' +
              a +
              '</option>',
          )
          .join('');
      };
      const modelKey = (m) => m.provider + '/' + m.modelId;
      const authSourceLabel = (p) => {
        if (!p.configured) return '未认证';
        if (p.authSource === 'stored') return '已登录';
        if (p.authSource === 'runtime') return '运行时 Key';
        if (p.authSource === 'environment')
          return '环境变量' + (p.authLabel ? ' · ' + p.authLabel : '');
        if (p.authSource === 'models_json_key') return 'models.json key';
        if (p.authSource === 'models_json_command') return 'models.json 命令';
        return p.authLabel || '已认证';
      };
      const canLogout = (p) =>
        p.authSource === 'stored' || p.authSource === 'runtime';

      // ── 渲染 ────────────────────────────────────────────

      function renderStatus() {
        const s = state.status ?? {};
        $('status').innerHTML = s.configured
          ? '已配置：<b>' +
            esc(s.provider) +
            ' · ' +
            esc(s.modelId) +
            '</b>' +
            (s.thinkingLevel
              ? '　思考档位 <b>' + esc(s.thinkingLevel) + '</b>'
              : '')
          : '尚未配置默认模型（先登录供应商，再选择模型）';
        const pick = $('pick-model');
        if (state.catalog.length === 0) {
          pick.innerHTML = '<option value="">（目录为空）</option>';
        } else {
          const cur = s.configured ? s.provider + '/' + s.modelId : '';
          const available = state.catalog.filter((m) => m.available);
          const missing = state.catalog.filter((m) => !m.available);
          const optionsOf = (list) =>
            list
              .map(
                (m) =>
                  '<option value="' +
                  esc(modelKey(m)) +
                  '"' +
                  (modelKey(m) === cur ? ' selected' : '') +
                  (m.available ? '' : ' disabled') +
                  '>' +
                  esc(m.provider + ' · ' + m.label) +
                  (m.reasoning ? ' ▸' : '') +
                  (m.available ? '' : '（未认证）') +
                  '</option>',
              )
              .join('');
          pick.innerHTML =
            (available.length
              ? '<optgroup label="可用（' +
                available.length +
                '）">' +
                optionsOf(available) +
                '</optgroup>'
              : '<option value="">（没有已认证供应商）</option>') +
            (missing.length
              ? '<optgroup label="未认证（' +
                missing.length +
                '）">' +
                optionsOf(missing) +
                '</optgroup>'
              : '');
        }
        $('pick-thinking').innerHTML =
          '<option value="">（不变）</option>' +
          state.levels
            .map(
              (l) =>
                '<option value="' +
                esc(l) +
                '"' +
                (s.thinkingLevel === l ? ' selected' : '') +
                '>' +
                esc(l) +
                '</option>',
            )
            .join('');
        $('new-api').innerHTML = apiOptions('openai-completions');
      }

      function renderProviders() {
        const filter = $('prov-filter').value.trim().toLowerCase();
        const onlyReady = $('prov-only-ready').checked;
        const list = state.providers.filter((p) => {
          if (onlyReady && !p.configured) return false;
          if (!filter) return true;
          return (
            p.id.toLowerCase().includes(filter) ||
            p.name.toLowerCase().includes(filter)
          );
        });
        $('prov-count').textContent =
          state.providers.length +
          ' 个（已认证 ' +
          state.providers.filter((p) => p.configured).length +
          '）';
        $('providers').innerHTML = list.length
          ? list.map(renderProvider).join('')
          : '<div class="empty">没有匹配的供应商。</div>';
      }

      function renderProvider(p) {
        const open = !!state.expanded[p.id];
        const custom = state.custom[p.id];
        const badge = p.configured
          ? '<span class="badge ok">● ' + esc(authSourceLabel(p)) + '</span>'
          : '<span class="badge off">○ 未认证</span>';
        let authRow = '';
        if (p.canApiKeyLogin) {
          authRow +=
            '<input type="password" data-f="apiKey" autocomplete="off" placeholder="API Key（' +
            (p.hasOAuthAuth ? '或使用下方 OAuth 登录' : '留空不修改') +
            '）" />' +
            '<button class="primary" data-action="login-key" data-pid="' +
            esc(p.id) +
            '">保存 Key</button>';
        }
        if (p.canOAuthLogin) {
          authRow +=
            '<button data-action="login-oauth" data-pid="' +
            esc(p.id) +
            '">OAuth 登录</button>';
        }
        if (canLogout(p)) {
          authRow +=
            '<button class="danger" data-action="logout" data-pid="' +
            esc(p.id) +
            '">退出登录</button>';
        }
        if (!p.canApiKeyLogin && !p.canOAuthLogin && !canLogout(p)) {
          authRow =
            '<span class="empty">此供应商仅支持环境变量 / 云端凭证，无需在此登录。</span>';
        }

        const models = state.catalog.filter((m) => m.provider === p.id);
        const modelRows = models.length
          ? models
              .map(
                (m) =>
                  '<tr><td>' +
                  esc(m.modelId) +
                  (m.available
                    ? ''
                    : ' <span class="badge off">未认证</span>') +
                  '</td><td>' +
                  esc(m.label) +
                  '</td><td class="num">' +
                  num(m.contextWindow) +
                  '</td><td class="num">' +
                  num(m.maxTokens) +
                  '</td><td>' +
                  (m.reasoning ? '✓' : '') +
                  '</td><td class="actions">' +
                  (m.available
                    ? '<button class="mini" data-action="use-model" data-pid="' +
                      esc(p.id) +
                      '" data-mid="' +
                      esc(m.modelId) +
                      '">设为默认</button> '
                    : '') +
                  '<button class="mini" data-action="edit-model" data-pid="' +
                  esc(p.id) +
                  '" data-mid="' +
                  esc(m.modelId) +
                  '">覆盖</button> ' +
                  '<button class="mini danger" data-action="delete-model" data-pid="' +
                  esc(p.id) +
                  '" data-mid="' +
                  esc(m.modelId) +
                  '">移除</button>' +
                  '</td></tr>',
              )
              .join('')
          : '<tr><td colspan="6" class="empty">目录为空。</td></tr>';

        const customEdit = custom
          ? '<div class="section-label">端点（models.json）</div>' +
            '<div class="row" style="margin-top: 8px">' +
            '<div class="field"><label>名称</label><input type="text" data-f="name" value="' +
            esc(custom.name || '') +
            '" /></div>' +
            '<div class="field"><label>Base URL</label><input type="text" data-f="baseUrl" value="' +
            esc(custom.baseUrl || '') +
            '" /></div>' +
            '<div class="field"><label>API 协议</label><select data-f="api">' +
            apiOptions(custom.api || 'openai-completions') +
            '</select></div>' +
            '<button class="primary" data-action="save-provider" data-pid="' +
            esc(p.id) +
            '">保存</button>' +
            '<button class="danger" data-action="delete-provider" data-pid="' +
            esc(p.id) +
            '">删除</button>' +
            '</div>' +
            '<div class="row"><div class="field" style="flex:1 1 100%"><label>额外请求头（JSON，可选）</label><textarea data-f="headers" placeholder=\'{"X-Foo":"bar"}\'>' +
            esc(
              custom.headers && Object.keys(custom.headers).length
                ? JSON.stringify(custom.headers, null, 2)
                : '',
            ) +
            '</textarea></div></div>'
          : '';

        return (
          '<div class="prov" data-pid="' +
          esc(p.id) +
          '"' +
          (open ? ' data-open="1"' : '') +
          '>' +
          '<div class="prov-head">' +
          '<span class="name">' +
          esc(p.name) +
          '</span>' +
          badge +
          (p.builtin ? '' : '<span class="badge off">自定义</span>') +
          '<span class="meta">' +
          esc(p.id) +
          (p.baseUrl ? ' · ' + esc(p.baseUrl) : '') +
          ' · 模型 ' +
          p.availableModelCount +
          '/' +
          p.modelCount +
          '</span>' +
          '<button class="mini" data-action="toggle-prov" data-pid="' +
          esc(p.id) +
          '">' +
          (open ? '收起' : '展开') +
          '</button>' +
          '</div>' +
          (open
            ? '<div class="prov-body">' +
              '<div class="section-label">认证</div>' +
              '<div class="row" style="margin-top: 8px">' +
              authRow +
              '</div>' +
              customEdit +
              '<div class="models">' +
              '<h4>模型目录（' +
              models.length +
              '）</h4>' +
              '<table><thead><tr><th>id</th><th>名称</th><th>上下文</th><th>maxTokens</th><th>思考</th><th></th></tr></thead><tbody>' +
              modelRows +
              '</tbody></table>' +
              '<div class="row" data-model-form hidden>' +
              '<div class="field"><label>模型 id</label><input type="text" data-mf="id" /></div>' +
              '<div class="field"><label>名称</label><input type="text" data-mf="name" /></div>' +
              '<div class="field"><label>上下文窗口</label><input type="number" data-mf="contextWindow" /></div>' +
              '<div class="field"><label>maxTokens</label><input type="number" data-mf="maxTokens" /></div>' +
              '<label style="font-size:12px;display:flex;gap:6px;align-items:center;padding-bottom:7px"><input type="checkbox" data-mf="reasoning" />推理</label>' +
              '<label style="font-size:12px;display:flex;gap:6px;align-items:center;padding-bottom:7px"><input type="checkbox" data-mf="image" />图片输入</label>' +
              '<button class="primary" data-action="save-model" data-pid="' +
              esc(p.id) +
              '">保存</button>' +
              '</div>' +
              '<div class="row"><button class="mini" data-action="new-model" data-pid="' +
              esc(p.id) +
              '">＋ 新增 / 覆盖模型（models.json）</button></div>' +
              '</div>' +
              '</div>'
            : '') +
          '</div>'
        );
      }

      function render() {
        renderStatus();
        renderProviders();
        saveExpanded();
      }

      // ── 展开态（会话内记忆，重渲染不丢） ────────────────

      function saveExpanded() {
        document.querySelectorAll('.prov[data-open]').forEach((el) => {
          state.expanded[el.dataset.pid] = true;
        });
      }

      // ── 动作 ─────────────────────────────────────────────

      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const prov = btn.closest('.prov');
        const pid = btn.dataset.pid || prov?.dataset.pid;
        const readField = (name) => {
          const el = prov?.querySelector('[data-f="' + name + '"]');
          return el ? el.value : '';
        };
        try {
          if (action === 'apply-model') {
            const pick = $('pick-model').value;
            if (!pick) throw new Error('先在「供应商」中登录并添加模型');
            const slash = pick.indexOf('/');
            const payload = {
              provider: pick.slice(0, slash),
              modelId: pick.slice(slash + 1),
            };
            const level = $('pick-thinking').value;
            if (level) payload.thinkingLevel = level;
            state.status = await invoke('app:agent.configure', payload);
            render();
            toast('已应用默认模型');
          } else if (action === 'add-provider') {
            const id = $('new-id').value.trim();
            const config = {
              name: $('new-name').value.trim() || id,
              baseUrl: $('new-base').value.trim(),
              api: $('new-api').value,
            };
            await invoke('app:models.saveProvider', { providerId: id, config });
            $('new-id').value = $('new-name').value = $('new-base').value = '';
            await refresh();
            toast('已添加供应商 ' + id);
          } else if (action === 'toggle-prov') {
            const wasOpen = !!prov.dataset.open;
            state.expanded[pid] = !wasOpen;
            render();
          } else if (action === 'login-key') {
            const key = readField('apiKey');
            if (!key) throw new Error('Key 为空');
            setBusy(btn, true, '登录中…');
            try {
              await invoke('app:models.login', {
                providerId: pid,
                type: 'api_key',
                apiKey: key,
              });
              await refresh();
              toast('已登录 ' + pid + '（凭证已写入 auth.json）');
            } finally {
              setBusy(btn, false);
            }
          } else if (action === 'login-oauth') {
            setBusy(btn, true, '等待授权…');
            try {
              await invoke('app:models.login', {
                providerId: pid,
                type: 'oauth',
              });
              await refresh();
              toast('已完成 ' + pid + ' 授权');
            } finally {
              setBusy(btn, false);
            }
          } else if (action === 'logout') {
            await invoke('app:models.logout', { providerId: pid });
            await refresh();
            toast('已退出 ' + pid);
          } else if (action === 'save-provider') {
            const headersText = readField('headers').trim();
            const config = {
              name: readField('name').trim(),
              baseUrl: readField('baseUrl').trim(),
              api: readField('api'),
            };
            if (headersText) {
              try {
                config.headers = JSON.parse(headersText);
              } catch {
                throw new Error('额外请求头不是合法 JSON');
              }
            }
            await invoke('app:models.saveProvider', {
              providerId: pid,
              config,
            });
            await refresh();
            toast('已保存供应商 ' + pid);
          } else if (action === 'delete-provider') {
            if (
              !window.confirm(
                '删除自定义供应商 ' + pid + '？models.json 中的条目将被移除。',
              )
            )
              return;
            await invoke('app:models.deleteProvider', { providerId: pid });
            await refresh();
            toast('已删除供应商 ' + pid);
          } else if (action === 'use-model') {
            await invoke('app:agent.configure', {
              provider: pid,
              modelId: btn.dataset.mid,
            });
            state.status = await invoke('app:agent.status');
            render();
            toast('已设为默认模型');
          } else if (action === 'new-model') {
            const form = prov.querySelector('[data-model-form]');
            form.hidden = !form.hidden;
            form.querySelectorAll('[data-mf]').forEach((el) => {
              if (el.type === 'checkbox') el.checked = false;
              else el.value = '';
              el.disabled = false;
            });
          } else if (action === 'edit-model') {
            const model =
              state.catalog.find(
                (m) => m.provider === pid && m.modelId === btn.dataset.mid,
              ) ?? {};
            const form = prov.querySelector('[data-model-form]');
            form.hidden = false;
            form.querySelector('[data-mf="id"]').value = btn.dataset.mid;
            form.querySelector('[data-mf="id"]').disabled = true;
            form.querySelector('[data-mf="name"]').value = model.label ?? '';
            form.querySelector('[data-mf="contextWindow"]').value =
              model.contextWindow ?? '';
            form.querySelector('[data-mf="maxTokens"]').value =
              model.maxTokens ?? '';
            form.querySelector('[data-mf="reasoning"]').checked =
              !!model.reasoning;
            form.querySelector('[data-mf="image"]').checked = !!(
              model.input && model.input.includes('image')
            );
          } else if (action === 'save-model') {
            const form = prov.querySelector('[data-model-form]');
            const model = {
              id: form.querySelector('[data-mf="id"]').value.trim(),
            };
            if (!model.id) throw new Error('模型 id 必填');
            const name = form.querySelector('[data-mf="name"]').value.trim();
            if (name) model.name = name;
            const ctx = form.querySelector('[data-mf="contextWindow"]').value;
            if (ctx) model.contextWindow = Number(ctx);
            const max = form.querySelector('[data-mf="maxTokens"]').value;
            if (max) model.maxTokens = Number(max);
            model.reasoning = form.querySelector(
              '[data-mf="reasoning"]',
            ).checked;
            model.input = form.querySelector('[data-mf="image"]').checked
              ? ['text', 'image']
              : ['text'];
            await invoke('app:models.saveModel', { providerId: pid, model });
            await refresh();
            toast('已保存模型 ' + model.id);
          } else if (action === 'delete-model') {
            if (
              !window.confirm(
                '从 models.json 移除模型 ' + btn.dataset.mid + '？',
              )
            )
              return;
            await invoke('app:models.deleteModel', {
              providerId: pid,
              modelId: btn.dataset.mid,
            });
            await refresh();
            toast('已移除 ' + btn.dataset.mid);
          }
        } catch (err) {
          toast(err && err.message ? err.message : String(err), true);
        }
      });

      $('prov-filter').addEventListener('input', renderProviders);
      $('prov-only-ready').addEventListener('change', renderProviders);

      function setBusy(btn, busy, label) {
        if (busy) {
          btn.dataset.label = btn.textContent;
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span> ' + esc(label);
        } else {
          btn.disabled = false;
          btn.textContent = btn.dataset.label || btn.textContent;
        }
      }

      async function refresh() {
        const [providers, catalog, status, levels, custom] = await Promise.all([
          invoke('app:models.providers'),
          invoke('app:models.catalog'),
          invoke('app:agent.status'),
          invoke('app:agent.thinkingLevels'),
          invoke('app:models.read'),
        ]);
        state.providers = Array.isArray(providers) ? providers : [];
        state.catalog = Array.isArray(catalog) ? catalog : [];
        state.status = status;
        state.levels = Array.isArray(levels) ? levels : [];
        state.custom = custom && custom.providers ? custom.providers : {};
        render();
      }

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 3600);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      refresh().catch((e) =>
        toast('读取失败：' + (e && e.message ? e.message : e), true),
      );
    </script>
  </body>
</html>
