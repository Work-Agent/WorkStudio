<!doctype html>
<!--
  扩展管理（设置能力页）。
  数据面：app:packages.*（社区目录 / 已配置清单 / 安装 / 卸载）+ app:plugins.list（本机内置插件）。
  目录来源：主进程抓 pi.dev 包目录 SSR 页面（无公开 JSON API）；安装走 pi DefaultPackageManager。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扩展管理</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --input-bg: #ffffff;
        --soft: #fafafa;
        --ok: #16a34a;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --input-bg: #1c1e1f;
        --soft: #1c1e1f;
        --ok: #4ade80;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        overflow: auto;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-top: 16px;
        border-bottom: 1px solid var(--border);
      }
      .tabs button {
        border: none;
        background: none;
        color: var(--muted);
        padding: 8px 12px;
        font-size: 12.5px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs button.on {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .searchbar {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      input[type='text'] {
        flex: 1;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12.5px;
        font-family: inherit;
      }
      input[type='text']:focus {
        outline: none;
        border-color: var(--accent);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .chip {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        border-radius: 999px;
        padding: 3px 11px;
        font-size: 11.5px;
        cursor: pointer;
      }
      .chip.on {
        background: var(--fg);
        color: var(--panel);
        border-color: var(--fg);
      }
      button.primary {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .card {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 2px;
        border-bottom: 1px solid var(--border);
      }
      .card:last-child {
        border-bottom: none;
      }
      .card .body {
        flex: 1;
        min-width: 0;
      }
      .card .name {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .card .name b {
        font-size: 13.5px;
        font-weight: 600;
      }
      .badge {
        font-size: 10.5px;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge.t-extension {
        color: #7c3aed;
        border-color: rgba(124, 58, 237, 0.35);
        background: rgba(124, 58, 237, 0.08);
      }
      .badge.t-skill {
        color: #0d9488;
        border-color: rgba(13, 148, 136, 0.35);
        background: rgba(13, 148, 136, 0.08);
      }
      .badge.t-prompt {
        color: #d97706;
        border-color: rgba(217, 119, 6, 0.35);
        background: rgba(217, 119, 6, 0.08);
      }
      .badge.t-theme {
        color: #db2777;
        border-color: rgba(219, 39, 119, 0.35);
        background: rgba(219, 39, 119, 0.08);
      }
      .card .desc {
        margin: 6px 0 0;
        font-size: 12.5px;
        line-height: 1.65;
        color: var(--fg);
      }
      .card .meta {
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .card .actions {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .card button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .card button.install {
        background: var(--fg);
        color: var(--panel);
        border-color: var(--fg);
      }
      .card button.danger {
        color: #dc2626;
      }
      html[data-theme='dark'] .card button.danger {
        color: #f87171;
      }
      .section-title {
        margin: 22px 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .empty {
        padding: 18px 2px;
        color: var(--muted);
        font-size: 12px;
      }
      .foot {
        margin: 18px 2px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
      }
      .err {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(220, 38, 38, 0.08);
        color: #dc2626;
        font-size: 12px;
      }
      html[data-theme='dark'] .err {
        color: #f87171;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
      .spinner {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -1px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Pi 扩展</h1>
        <p>
          从 pi.dev 社区目录浏览安装 Pi 包（扩展 / 技能 / 提示词 /
          主题）。安装写入 <code>settings.json</code> 的
          <code>packages</code> 并落盘依赖；安装 / 卸载后自动热重载当前会话资源。
          技能清单见「技能」页，WorkStudio 插件见「插件」页。
        </p>
      </header>

      <div class="tabs">
        <button id="tab-browse" class="on">浏览社区</button>
        <button id="tab-installed">已安装</button>
      </div>

      <section id="pane-browse">
        <div class="searchbar">
          <input
            type="text"
            id="q"
            placeholder="搜索社区包，如 mcp、web 搜索…"
            autocomplete="off"
          />
        </div>
        <div class="chips" id="types"></div>
        <div id="catalog"></div>
        <div
          id="catalog-more"
          style="text-align: center; margin-top: 12px"
        ></div>
        <div id="catalog-error"></div>
      </section>

      <section id="pane-installed" hidden>
        <div class="section-title">已安装的 Pi 包</div>
        <div id="configured"></div>
        <div class="section-title">已加载扩展（当前会话）</div>
        <div id="loaded"></div>
      </section>

      <p class="foot">
        社区目录来自 pi.dev 包目录（服务端搜索与分页）；「已安装」= 当前
        <code>settings.json</code> 中配置的 Pi 包，卸载即从配置移除。
        第三方包可执行代码，安装前请确认来源。
      </p>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const TYPES = [
        { id: '', label: '全部' },
        { id: 'extension', label: '扩展' },
        { id: 'skill', label: '技能' },
        { id: 'prompt', label: '提示词' },
        { id: 'theme', label: '主题' },
      ];
      const TYPE_LABEL = {
        extension: 'extension',
        skill: 'skill',
        prompt: 'prompt',
        theme: 'theme',
        package: 'package',
      };

      const state = {
        tab: 'browse',
        query: '',
        type: '',
        page: 0,
        total: 0,
        packages: [],
        configured: [],
        loaded: null,
        loading: false,
        busy: {},
      };

      const invoke = (cmd, payload) => window.extension.invoke(cmd, payload);
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );

      function fmtDownloads(n) {
        if (!n) return '0/月';
        if (n < 1000) return n + '/月';
        if (n < 10_000) return (n / 1000).toFixed(1) + 'K/月';
        if (n < 1_000_000) return Math.round(n / 1000) + 'K/月';
        return (n / 1_000_000).toFixed(1) + 'M/月';
      }

      function fmtAgo(ts) {
        if (!ts) return '';
        const days = Math.floor((Date.now() - ts) / 86_400_000);
        if (days <= 0) return '今天';
        if (days < 30) return days + ' 天前';
        if (days < 365) return Math.floor(days / 30) + ' 个月前';
        return Math.floor(days / 365) + ' 年前';
      }

      const isInstalled = (name) =>
        state.configured.some((p) => p.source === 'npm:' + name);

      // ── 渲染 ────────────────────────────────────────────

      function renderTabs() {
        $('tab-browse').classList.toggle('on', state.tab === 'browse');
        $('tab-installed').classList.toggle('on', state.tab === 'installed');
        $('pane-browse').hidden = state.tab !== 'browse';
        $('pane-installed').hidden = state.tab !== 'installed';
      }

      function renderTypes() {
        $('types').innerHTML = TYPES.map(
          (t) =>
            '<button class="chip' +
            (state.type === t.id ? ' on' : '') +
            '" data-type="' +
            t.id +
            '">' +
            t.label +
            '</button>',
        ).join('');
      }

      function renderCatalog() {
        const el = $('catalog');
        if (state.loading && state.packages.length === 0) {
          el.innerHTML =
            '<div class="empty"><span class="spinner"></span> 正在读取社区目录…</div>';
          $('catalog-more').innerHTML = '';
          return;
        }
        if (state.packages.length === 0) {
          el.innerHTML = '<div class="empty">没有匹配的社区包。</div>';
          $('catalog-more').innerHTML = '';
          return;
        }
        el.innerHTML = state.packages.map(renderCard).join('');
        const shown = state.packages.length;
        $('catalog-more').innerHTML =
          shown < state.total
            ? '<button id="more">加载更多（' +
              shown +
              ' / ' +
              state.total +
              '）</button>'
            : '<span style="color:var(--muted);font-size:11px">已到末尾 · 共 ' +
              state.total +
              ' 个</span>';
        if (shown < state.total) {
          $('more').onclick = () => void loadCatalog(true);
        }
      }

      function renderCard(p) {
        const badges = p.types
          .map(
            (t) =>
              '<span class="badge t-' +
              esc(t) +
              '">' +
              esc(TYPE_LABEL[t] ?? t) +
              '</span>',
          )
          .join('');
        const installed = isInstalled(p.name);
        const busy = state.busy['install:' + p.name];
        return (
          '<div class="card">' +
          '<div class="body">' +
          '<div class="name"><b>' +
          esc(p.name) +
          '</b>' +
          badges +
          '</div>' +
          '<p class="desc">' +
          esc(p.description || '（无描述）') +
          '</p>' +
          '<div class="meta"><span>' +
          esc(p.author || '未知作者') +
          '</span><span>' +
          fmtDownloads(p.downloads) +
          '</span>' +
          (p.updatedAt ? '<span>' + fmtAgo(p.updatedAt) + '</span>' : '') +
          '</div>' +
          '</div>' +
          '<div class="actions">' +
          (installed
            ? '<button disabled>已安装</button>'
            : '<button class="install" data-install="' +
              esc(p.name) +
              '"' +
              (busy ? ' disabled' : '') +
              '>' +
              (busy ? '安装中…' : '安装') +
              '</button>') +
          '</div>' +
          '</div>'
        );
      }

      function renderConfigured() {
        const el = $('configured');
        if (state.configured.length === 0) {
          el.innerHTML =
            '<div class="empty">还没有安装 Pi 包。切到「浏览社区」挑一个。</div>';
          return;
        }
        el.innerHTML = state.configured
          .map((p) => {
            const name = p.source.replace(/^npm:/, '').replace(/^git:/, '');
            const busy = state.busy['remove:' + p.source];
            const builtin = p.source.startsWith('builtin:');
            return (
              '<div class="card">' +
              '<div class="body">' +
              '<div class="name"><b>' +
              esc(name) +
              '</b><span class="badge">' +
              esc(p.scope === 'project' ? '本工作区' : '全局') +
              '</span>' +
              (builtin ? '<span class="badge">内置</span>' : '') +
              '</div>' +
              '<div class="meta"><span>' +
              esc(p.source) +
              '</span>' +
              (p.installedPath
                ? '<span title="' + esc(p.installedPath) + '">已落盘</span>'
                : '') +
              '</div>' +
              '</div>' +
              '<div class="actions">' +
              (builtin
                ? '<span style="color:var(--muted);font-size:11px">内置项在「偏好设置」中调整</span>'
                : '<button class="danger" data-remove="' +
                  esc(p.source) +
                  '" data-scope="' +
                  esc(p.scope) +
                  '"' +
                  (busy ? ' disabled' : '') +
                  '>' +
                  (busy ? '卸载中…' : '卸载') +
                  '</button>') +
              '</div>' +
              '</div>'
            );
          })
          .join('');
      }

      function renderLoaded() {
        const el = $('loaded');
        const r = state.loaded;
        if (!r) {
          el.innerHTML = '<div class="empty">读取中…</div>';
          return;
        }
        const short = (p) =>
          String(p || '')
            .split(/[/\\]/)
            .slice(-2)
            .join('/');
        const rows = [];
        for (const e of r.extensions) {
          const caps = [];
          if (e.tools.length) caps.push('工具 ' + e.tools.join(', '));
          if (e.commands.length) caps.push('命令 /' + e.commands.join(' /'));
          rows.push(
            '<div class="card"><div class="body">' +
              '<div class="name"><b>' +
              esc(short(e.path)) +
              '</b><span class="badge">extension</span>' +
              (e.hidden ? '<span class="badge">隐藏</span>' : '') +
              '</div>' +
              '<div class="meta"><span title="' +
              esc(e.path) +
              '">' +
              esc(e.path) +
              '</span>' +
              (caps.length ? '<span>' + esc(caps.join(' · ')) + '</span>' : '') +
              '</div></div></div>',
          );
        }
        for (const err of r.errors) {
          rows.push(
            '<div class="err">装载失败：' +
              esc(short(err.path)) +
              ' — ' +
              esc(err.message.slice(0, 300)) +
              '</div>',
          );
        }
        el.innerHTML =
          rows.length > 0
            ? rows.join('')
            : '<div class="empty">当前会话没有加载 Pi 扩展。</div>';
      }

      function render() {
        renderTabs();
        renderTypes();
        renderCatalog();
        renderConfigured();
        renderLoaded();
      }

      // ── 交互 ────────────────────────────────────────────

      $('tab-browse').onclick = () => {
        state.tab = 'browse';
        render();
      };
      $('tab-installed').onclick = () => {
        state.tab = 'installed';
        void loadConfigured();
      };


      $('q').addEventListener('input', (e) => {
        state.query = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => void loadCatalog(false), 300);
      });

      $('types').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-type]');
        if (!btn) return;
        state.type = btn.dataset.type;
        void loadCatalog(false);
      });

      document.addEventListener('click', (e) => {
        const installBtn = e.target.closest('[data-install]');
        if (installBtn) {
          void install(installBtn.dataset.install);
          return;
        }
        const removeBtn = e.target.closest('[data-remove]');
        if (removeBtn) {
          void remove(removeBtn.dataset.remove, removeBtn.dataset.scope);
        }
      });

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 3600);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
      });
      window.extension.bus.loaded();
      void loadConfigured();
      void loadCatalog(false);
    </script>
  </body>
</html>
