<!doctype html>
<!--
  偏好设置页（设置能力页）—— architecture.md §5.3 / §6.4。
  数据面：window.appBridge（/piconf settings / ura）；两层：App 默认 / 本工作区。
  值语义：null = 删除该键（回落继承 / pi 默认）；未列出的字段原样保真。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>偏好设置</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --fg: #27272a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f6bed;
        --accent-hover: #3d56e0;
        --input-bg: #ffffff;
        --danger: #dc2626;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1c1d;
        --panel: #202124;
        --fg: #e4e4e7;
        --muted: #8b8d8e;
        --border: #2a2d2e;
        --accent: #6c86f0;
        --accent-hover: #5a76e8;
        --input-bg: #1c1e1f;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        overflow: auto;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-top: 16px;
      }
      .card h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .scope {
        font-weight: 400;
        font-size: 11px;
        color: var(--muted);
      }
      .path {
        margin-top: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
      }
      .grid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 14px;
      }
      .field.wide {
        grid-column: 1 / -1;
      }
      .field label {
        display: block;
        font-size: 12px;
        margin-bottom: 5px;
        color: var(--fg);
      }
      .cur {
        color: var(--muted);
        font-size: 11px;
        margin-left: 6px;
      }
      input[type='text'],
      input[type='number'],
      select,
      textarea {
        width: 100%;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        font-family: inherit;
      }
      textarea {
        min-height: 68px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .field.check {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 18px;
      }
      .field.check label {
        margin: 0;
      }
      .row-end {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .hint {
        margin-right: auto;
        color: var(--muted);
        font-size: 11px;
      }
      button {
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .foot {
        margin: 16px 2px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(8px);
        background: rgba(24, 24, 27, 0.94);
        color: #fafafa;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #991b1b;
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
        padding: 8px 0;
      }
      .reg-groups {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .reg-group .reg-title {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .reg-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 12px;
      }
      .reg-row:nth-child(odd) {
        background: var(--hover);
      }
      .reg-key {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .reg-owner {
        flex-shrink: 0;
        color: var(--muted);
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .reg-diag {
        margin-top: 12px;
        font-size: 11.5px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>偏好设置</h1>
        <p>
          应用默认供所有工作区继承。当前工作区的单独设置优先；清空选项并保存即可恢复继承。
        </p>
      </header>

      <label style="display: block; margin-top: 22px"
        >设置作用范围<select id="settings-scope" style="margin-top: 8px">
          <option value="project">当前工作区</option>
          <option value="global">应用默认 · 所有工作区</option>
        </select></label
      >
      <section class="card" id="scope-global" hidden>
        <h3>App 默认 <span class="scope">其他工作区继承此处</span></h3>
        <div class="path" id="path-global"></div>
        <div class="grid" id="grid-global"></div>
        <div class="row-end">
          <span class="hint" id="hint-global"></span>
          <button onclick="restoreScope('global')">恢复默认</button>
          <button class="primary" onclick="save('global')">
            保存 App 默认
          </button>
        </div>
      </section>

      <section class="card" id="scope-project">
        <h3>本工作区 <span class="scope">未设置时继承应用默认</span></h3>
        <div class="path" id="path-project"></div>
        <div class="grid" id="grid-project"></div>
        <div class="row-end">
          <span class="hint" id="hint-project"></span>
          <button onclick="restoreScope('project')">恢复继承</button>
          <button class="primary" onclick="save('project')">
            保存本工作区
          </button>
        </div>
      </section>

      <details style="margin-top: 24px">
        <summary>高级资源管道与绑定</summary>
        <section class="card">
          <h3>本工作区 · 注册项 <span class="scope">URA 注册表</span></h3>
          <p class="hint" style="margin: -4px 0 12px">
            应用级注册表在启动时装配；这里只展示本工作区当前可用的实现。
          </p>
          <div class="reg-groups" id="registry"></div>
          <div class="reg-group">
            <div class="reg-title">
              绑定（(transport, mime) → codec / presenter）
            </div>
            <div id="bindings"></div>
            <div
              style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px"
            >
              <input
                id="b-transport"
                placeholder="transport: file / https / *"
                style="flex: 1; min-width: 120px"
              />
              <input
                id="b-mime"
                placeholder="mime: text/html / *"
                style="flex: 1; min-width: 120px"
              />
              <input
                id="b-codec"
                placeholder="codec id（可选）"
                style="flex: 1; min-width: 120px"
              />
              <input
                id="b-presenter"
                placeholder="presenter（可选）"
                style="flex: 1; min-width: 120px"
              />
              <button onclick="addBinding()">写入</button>
            </div>
          </div>
          <div class="reg-diag" id="registry-diag"></div>
          <div class="row-end">
            <span class="hint"></span>
            <button onclick="loadRegistry()">刷新注册项</button>
          </div>
        </section>
      </details>

      <p class="foot">
        保存后用于后续会话。当前会话的模型与思考档位可在助手输入区单独选择。
      </p>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      // ── 字段目录（点分路径 ↔ 控件；null = 删除键回落默认） ──
      const THINKING = ['', 'off', 'minimal', 'low', 'medium', 'high', 'xhigh'];
      const MODES = ['', 'all', 'one-at-a-time'];
      const FIELDS = {
        global: [
          {
            path: 'defaultThinkingLevel',
            label: '默认思考档位',
            type: 'select',
            options: THINKING,
          },
          {
            path: 'theme',
            label: '主题（pi 主题名）',
            type: 'text',
            placeholder: '留空 = 默认',
          },
          {
            path: 'steeringMode',
            label: '转向模式',
            type: 'select',
            options: MODES,
          },
          {
            path: 'followUpMode',
            label: '追问模式',
            type: 'select',
            options: MODES,
          },
          {
            path: 'compaction.enabled',
            label: '自动压缩上下文',
            type: 'check',
          },
          { path: 'retry.enabled', label: '失败自动重试', type: 'check' },
          {
            path: 'compaction.reserveTokens',
            label: '压缩保留 tokens',
            type: 'number',
          },
          { path: 'retry.maxRetries', label: '重试次数', type: 'number' },
          {
            path: 'compaction.keepRecentTokens',
            label: '压缩近端保留 tokens',
            type: 'number',
          },
          {
            path: 'retry.baseDelayMs',
            label: '重试基础延迟 ms',
            type: 'number',
          },
          { path: 'hideThinkingBlock', label: '折叠思考块', type: 'check' },
          { path: 'quietStartup', label: '静默启动', type: 'check' },
          { path: 'enableSkillCommands', label: '技能斜杠命令', type: 'check' },
          { path: 'images.autoResize', label: '图片自动缩放', type: 'check' },
          { path: 'images.blockImages', label: '阻止图片输入', type: 'check' },
          {
            path: 'externalEditor',
            label: '外部编辑器（$EDITOR）',
            type: 'text',
            wide: true,
          },
          {
            path: 'workspaceStudio.proxy',
            label: '网络代理（插件等 GitHub 下载；如 http://127.0.0.1:7890）',
            type: 'text',
            wide: true,
          },
        ],
        project: [
          {
            path: 'enabledModels',
            label: '模型白名单（provider/modelId，每行一个；空 = 全部）',
            type: 'lines',
            wide: true,
          },
          {
            path: 'extensions',
            label: 'pi 扩展路径（每行一个）',
            type: 'lines',
          },
          { path: 'skills', label: '技能目录（每行一个）', type: 'lines' },
          { path: 'prompts', label: '提示模板路径（每行一个）', type: 'lines' },
          { path: 'themes', label: '主题路径（每行一个）', type: 'lines' },
        ],
      };

      FIELDS.project.unshift(
        ...FIELDS.global.filter(
          (field) => !['theme', 'workspaceStudio.proxy'].includes(field.path),
        ),
      );
      let view = null;

      const bridge = window.appBridge;
      const shortPath = (value) => window.pathDisplay?.format(value) ?? value;
      async function call(path, input) {
        const result = await bridge.call(path, input);
        if (!result.ok) throw new Error(result.error.message);
        return result.data;
      }
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );

      function getByPath(obj, path) {
        let cur = obj;
        for (const k of path.split('.')) {
          if (cur == null || typeof cur !== 'object') return undefined;
          cur = cur[k];
        }
        return cur;
      }
      function hasByPath(obj, path) {
        let cur = obj;
        for (const k of path.split('.')) {
          if (cur == null || typeof cur !== 'object' || !(k in cur))
            return false;
          cur = cur[k];
        }
        return true;
      }
      const fmt = (v) => (Array.isArray(v) ? v.join(' / ') : String(v));

      function renderScope(scope, own, effective) {
        const grid = $('grid-' + scope);
        grid.innerHTML = '';
        const advanced = document.createElement('details');
        advanced.className = 'wide';
        const summary = document.createElement('summary');
        summary.textContent = '高级运行参数与资源路径';
        advanced.append(summary);
        const advancedGrid = document.createElement('div');
        advancedGrid.className = 'grid';
        advanced.append(advancedGrid);
        for (const f of FIELDS[scope]) {
          const val = getByPath(own, f.path);
          const eff = getByPath(effective, f.path);
          const inherited = !hasByPath(own, f.path);
          const cur = inherited
            ? eff !== undefined
              ? '（生效: ' + fmt(eff) + '）'
              : '（未设置）'
            : '';
          const div = document.createElement('div');
          div.className =
            'field' +
            (f.wide ? ' wide' : '') +
            (f.type === 'check' ? ' check' : '');
          let control = '';
          if (f.type === 'check') {
            control =
              '<input type="checkbox" data-path="' +
              f.path +
              '" data-type="check"' +
              (val === true ? ' checked' : '') +
              '>';
            div.innerHTML =
              control +
              '<label>' +
              f.label +
              '<span class="cur">' +
              cur +
              '</span></label>';
          } else if (f.type === 'select') {
            control =
              '<select data-path="' +
              f.path +
              '" data-type="select">' +
              f.options
                .map(
                  (o) =>
                    '<option value="' +
                    o +
                    '"' +
                    (String(val ?? '') === o ? ' selected' : '') +
                    '>' +
                    (o === '' ? '（默认）' : o) +
                    '</option>',
                )
                .join('') +
              '</select>';
            div.innerHTML =
              '<label>' +
              f.label +
              '<span class="cur">' +
              cur +
              '</span></label>' +
              control;
          } else if (f.type === 'number') {
            control =
              '<input type="number" data-path="' +
              f.path +
              '" data-type="number" value="' +
              (val ?? '') +
              '" placeholder="默认">';
            div.innerHTML =
              '<label>' +
              f.label +
              '<span class="cur">' +
              cur +
              '</span></label>' +
              control;
          } else if (f.type === 'lines') {
            control =
              '<textarea data-path="' +
              f.path +
              '" data-type="lines" spellcheck="false">' +
              esc(Array.isArray(val) ? val.join('\n') : '') +
              '</textarea>';
            div.innerHTML =
              '<label>' +
              f.label +
              '<span class="cur">' +
              cur +
              '</span></label>' +
              control;
          } else {
            control =
              '<input type="text" data-path="' +
              f.path +
              '" data-type="text" value="' +
              esc(val ?? '') +
              '"' +
              (f.placeholder
                ? ' placeholder="' + esc(f.placeholder) + '"'
                : '') +
              '>';
            div.innerHTML =
              '<label>' +
              f.label +
              '<span class="cur">' +
              cur +
              '</span></label>' +
              control;
          }
          const input = div.querySelector('input,select,textarea');
          const label = div.querySelector('label');
          if (input && label) {
            input.id = scope + '-' + f.path;
            label.htmlFor = input.id;
          }
          if (
            [
              'defaultThinkingLevel',
              'compaction.enabled',
              'retry.enabled',
              'retry.maxRetries',
              'workspaceStudio.proxy',
              'enabledModels',
            ].includes(f.path)
          )
            grid.appendChild(div);
          else advancedGrid.appendChild(div);
        }
        if (advancedGrid.children.length) grid.append(advanced);
      }

      function restoreScope(scope) {
        $('grid-' + scope)
          .querySelectorAll('[data-path]')
          .forEach((el) => {
            if (el.type === 'checkbox') el.checked = false;
            else el.value = '';
          });
        dirtyScopes.add(scope);
        window.extension.bus.send({ type: 'dirty', dirty: true });
        toast('已恢复继承值，保存后生效');
      }
      const dirtyScopes = new Set();
      $('settings-scope').addEventListener('change', async (e) => {
        const next = e.target.value;
        const current = next === 'global' ? 'project' : 'global';
        if (dirtyScopes.has(current)) {
          e.target.value = current;
          const response = await call('/dialogs/ask', {
            dialogType: 'select',
            title: '切换范围前保存设置？',
            message: '应用默认和当前工作区分别保存。',
            options: ['保存并切换', '放弃修改'],
          });
          if (response.cancelled) return;
          if (response.value === '保存并切换') {
            await save(current);
            if (dirtyScopes.has(current)) return;
          } else {
            dirtyScopes.delete(current);
            window.extension.bus.send({
              type: 'dirty',
              dirty: dirtyScopes.size > 0,
            });
            render();
          }
        }
        e.target.value = next;
        $('scope-global').hidden = next !== 'global';
        $('scope-project').hidden = next !== 'project';
      });
      document.addEventListener('input', (e) => {
        const grid = e.target.closest('[id^=grid-]');
        if (grid && e.target.matches('[data-path]')) {
          dirtyScopes.add(grid.id.slice(5));
          window.extension.bus.send({ type: 'dirty', dirty: true });
        }
      });
      function render() {
        $('path-global').textContent = shortPath(view.paths.global);
        $('path-project').textContent = shortPath(view.paths.project);
        if (!dirtyScopes.has('global'))
          renderScope('global', view.global, view.effective);
        if (!dirtyScopes.has('project'))
          renderScope('project', view.project, view.effective);
      }

      /** 控件值 → 设置值（null = 删除该键）。 */
      function readControl(el) {
        const type = el.dataset.type;
        if (type === 'check') return el.checked ? true : null;
        if (type === 'number') return el.value === '' ? null : Number(el.value);
        if (type === 'lines') {
          const lines = el.value
            .split('\n')
            .map((s) => s.trim())
            .filter(Boolean);
          return lines.length ? lines : null;
        }
        return el.value === '' ? null : el.value;
      }

      async function save(scope) {
        const box = $('grid-' + scope);
        const changes = [];
        box.querySelectorAll('[data-path]').forEach((el) => {
          const path = el.dataset.path;
          const next = readControl(el);
          const prevRaw = getByPath(view[scope], path);
          const prev = prevRaw === undefined ? null : prevRaw;
          const same =
            JSON.stringify(prev) === JSON.stringify(next) ||
            (prev === null && next === null);
          if (!same) changes.push({ path, value: next });
        });
        if (!changes.length) {
          dirtyScopes.delete(scope);
          window.extension.bus.send({
            type: 'dirty',
            dirty: dirtyScopes.size > 0,
          });
          toast('没有改动');
          return;
        }
        const path =
          scope === 'global'
            ? '/piconf/settings/set-global'
            : '/piconf/settings/set-project';
        try {
          for (const change of changes) {
            view = await call(path, change);
          }
          dirtyScopes.delete(scope);
          window.extension.bus.send({
            type: 'dirty',
            dirty: dirtyScopes.size > 0,
          });
          render();
          toast(
            '已保存 ' +
              changes.length +
              ' 项到 ' +
              (scope === 'global' ? 'App 默认' : '本工作区'),
          );
        } catch (e) {
          window.extension.bus.send({ type: 'save-result', ok: false });
          toast('保存失败：' + (e && e.message ? e.message : e), true);
        }
      }

      async function load() {
        try {
          view = (await bridge.peek('/piconf'))?.settings ?? null;
          render();
        } catch (e) {
          toast('读取失败：' + (e && e.message ? e.message : e), true);
        }
      }

      // ── URA 注册表（哪几个注册面已经装配） ──
      function regRows(rows, keyOf) {
        if (!rows.length) return '<div class="empty">未注册</div>';
        return rows
          .map(
            (row) =>
              '<div class="reg-row"><span class="reg-key">' +
              esc(keyOf(row)) +
              '</span><span class="reg-owner">' +
              esc(row.owner) +
              '</span></div>',
          )
          .join('');
      }

      function outletKey(key) {
        return key
          ? key.transport + '/' + key.mime + '/' + (key.codec || '-')
          : '';
      }

      function renderBindings(rows) {
        const el = $('bindings');
        if (!rows || rows.length === 0) {
          el.innerHTML =
            '<div class="empty">无绑定：按 MIME 与来源默认解析</div>';
          return;
        }
        el.innerHTML = rows
          .map(
            (b) =>
              '<div class="reg-row"><span class="reg-key">' +
              esc(b.transport + ' · ' + b.mime) +
              '</span><span class="reg-owner">' +
              esc(
                [b.codec, b.presenter].filter(Boolean).join(' → ') || '默认',
              ) +
              ' <button data-bind-remove data-transport="' +
              esc(b.transport) +
              '" data-mime="' +
              esc(b.mime) +
              '">删除</button></span></div>',
          )
          .join('');
      }

      function renderRegistry(data) {
        renderBindings(data.bindings || []);
        const groups = [
          ['来源 transport', data.transports || [], (r) => r.scheme],
          [
            '格式 codec',
            data.codecs || [],
            (r) =>
              r.id +
              ' · ' +
              (r.keys || []).map((k) => k.transport + '/' + k.mime).join(' '),
          ],
          ['数据 store', data.stores || [], (r) => outletKey(r.key)],
          [
            '页面出口 presenter',
            data.presenters || [],
            (r) => outletKey(r.key) + (r.surface ? ' → ' + r.surface : ''),
          ],
          ['文本出口 sidecar', data.sidecars || [], (r) => outletKey(r.key)],
          [
            '动作 view action',
            data.actions || [],
            (r) =>
              r.id +
              ' · ' +
              r.label +
              ' → ' +
              r.target +
              (r.toggle ? '（开关）' : ''),
          ],
        ];
        $('registry').innerHTML = groups
          .map(
            ([title, rows, keyOf]) =>
              '<div class="reg-group"><div class="reg-title">' +
              esc(title) +
              '</div>' +
              regRows(rows, keyOf) +
              '</div>',
          )
          .join('');
        const diagnostics = data.diagnostics || [];
        const issues = diagnostics.filter((d) => d.level !== 'info');
        $('registry-diag').textContent = issues.length
          ? '诊断：' + issues.map((d) => d.code + ' ' + d.message).join('；')
          : '';
      }

      async function addBinding() {
        try {
          await call('/piconf/ura/bindings/set', {
            binding: {
              transport: $('b-transport').value.trim() || '*',
              mime: $('b-mime').value.trim() || '*',
              ...($('b-codec').value.trim()
                ? { codec: $('b-codec').value.trim() }
                : {}),
              ...($('b-presenter').value.trim()
                ? { presenter: $('b-presenter').value.trim() }
                : {}),
            },
          });
          $('b-transport').value = '';
          $('b-mime').value = '';
          $('b-codec').value = '';
          $('b-presenter').value = '';
          await loadRegistry();
          toast('绑定已写入');
        } catch (e) {
          toast('写入绑定失败：' + (e && e.message ? e.message : e), true);
        }
      }

      async function removeBinding(transport, mime) {
        try {
          await call('/piconf/ura/bindings/remove', { transport, mime });
          await loadRegistry();
          toast('绑定已删除');
        } catch (e) {
          toast('删除绑定失败：' + (e && e.message ? e.message : e), true);
        }
      }

      async function loadRegistry() {
        try {
          renderRegistry(await call('/piconf/ura/registry'));
        } catch (e) {
          toast('注册项读取失败：' + (e && e.message ? e.message : e), true);
        }
      }

      let toastTimer = 0;
      function toast(message, error) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.className = 'toast'), 2200);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === 'dark' ? 'dark' : 'light';
      }

      $('bindings').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-bind-remove]');
        if (btn) {
          void removeBinding(btn.dataset.transport, btn.dataset.mime);
        }
      });

      // 主题：系统偏好起步，主进程广播收敛（零白闪）
      void loadRegistry();
      applyTheme(
        window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light',
      );
      window.extension.bus.on((msg) => {
        if (msg && msg.type === 'theme') applyTheme(msg.theme);
        if (msg?.type === 'action' && msg.id === 'save')
          void (async () => {
            for (const scope of [...dirtyScopes]) await save(scope);
          })();
      });
      window.extension.bus.loaded();
      load();
    </script>
  </body>
</html>
