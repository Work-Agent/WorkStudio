<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>资源诊断</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.65 -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          sans-serif;
      }
      .wrap {
        max-width: 780px;
        margin: auto;
        padding: 28px;
      }
      header {
        display: flex;
        align-items: start;
        gap: 18px;
        justify-content: space-between;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 7px;
      }
      h2 {
        font-size: 15px;
        margin: 26px 0 10px;
      }
      p {
        margin: 5px 0;
        color: var(--muted);
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--fg);
        padding: 6px 10px;
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
      }
      .row div {
        flex: 1;
        min-width: 0;
      }
      .row p {
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .badge {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        padding: 10px 7px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-weight: 400;
        overflow-wrap: anywhere;
      }
      th {
        color: var(--muted);
      }
      .note {
        margin-top: 24px;
        padding: 13px;
        border-left: 2px solid var(--accent);
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        color: var(--danger);
        white-space: pre-wrap;
      }
      details {
        margin-top: 24px;
      }
      summary {
        cursor: pointer;
      }
      #scope {
        padding: 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 7px;
        margin-top: 22px;
      }
      @media (max-width: 520px) {
        .wrap {
          padding: 22px 16px;
        }
        header {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <div>
          <h1>资源诊断</h1>
          <p>检查当前工作区的资料来源、格式支持和加载错误。</p>
        </div>
        <button id="refresh">刷新状态</button>
      </header>
      <div id="scope"></div>
      <p id="error" class="error" role="alert"></p>
      <h2>资料来源</h2>
      <div id="sources"></div>
      <h2>格式支持</h2>
      <table>
        <thead>
          <tr>
            <th>处理能力</th>
            <th>可识别格式</th>
            <th>归属</th>
          </tr>
        </thead>
        <tbody id="formats"></tbody>
      </table>
      <div class="note">
        日常查找和打开资料请使用左侧列表。这里与侧栏使用同一份来源状态；刷新不会重建或修改资料。
      </div>
      <details>
        <summary>高级注册信息与绑定</summary>
        <div id="registry"></div>
        <button id="bindings" style="margin-top: 16px">打开高级绑定设置</button>
      </details>
    </main>
    <script>
      const $ = (id) => document.getElementById(id),
        bridge = window.appBridge;
      const esc = (v) =>
        String(v ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      async function call(path, input) {
        const r = await bridge.call(path, input);
        if (!r.ok) throw new Error(r.error.message);
        return r.data;
      }
      let currentId = null;
      function renderSources(snapshot) {
        const groups = (snapshot?.groups ?? []).filter(
          (g) => g.section === 'resources',
        );
        $('sources').innerHTML = groups.length
          ? groups
              .map(
                (g) =>
                  '<div class="row"><div><strong>' +
                  esc(g.label) +
                  '</strong><p>' +
                  g.count +
                  ' 项资料' +
                  (g.diagnostics?.length
                    ? ' · ' + esc(g.diagnostics.join('；'))
                    : '') +
                  '</p></div><span class="badge">' +
                  (g.state === 'ready'
                    ? '可用'
                    : g.state === 'error'
                      ? '需要处理'
                      : '加载中') +
                  '</span></div>',
              )
              .join('')
          : '<p>当前没有资料来源。</p>';
      }
      async function refresh() {
        try {
          $('refresh').disabled = true;
          $('error').textContent = '';
          const ws = await bridge.peek('/workspaces/current');
          if (!ws) throw new Error('当前没有工作区');
          currentId = ws.id;
          $('scope').textContent =
            '当前工作区 · ' +
            ws.name +
            ' · ' +
            new Date().toLocaleTimeString() +
            ' 更新';
          const [snapshot, registry] = await Promise.all([
            call('/workspaces/' + ws.id + '/lists/refresh'),
            call('/piconf/ura/registry'),
          ]);
          renderSources(snapshot);
          $('formats').innerHTML =
            (registry.codecs ?? [])
              .map(
                (c) =>
                  '<tr><td>' +
                  esc(c.id) +
                  '</td><td>' +
                  esc((c.keys ?? []).map((k) => k.mime).join(' / ')) +
                  '</td><td>' +
                  esc(c.owner ?? '应用') +
                  '</td></tr>',
              )
              .join('') ||
            '<tr><td colspan="3">没有可用的格式处理能力，请检查插件加载状态。</td></tr>';
          $('registry').textContent =
            '传输实现 ' +
            (registry.transports?.length ?? 0) +
            ' · 页面出口 ' +
            (registry.presenters?.length ?? 0) +
            ' · 绑定 ' +
            (registry.bindings?.length ?? 0);
          void bridge.watch(['/workspaces/' + ws.id + '/lists']);
        } catch (e) {
          $('error').textContent = e.message;
        } finally {
          $('refresh').disabled = false;
        }
      }
      $('refresh').onclick = () => void refresh();
      $('bindings').onclick = () =>
        void call('/settings/open', { pageId: 'preferences' });
      bridge.on((f) => {
        if (
          f.type === 'state' &&
          f.path === '/workspaces/' + currentId + '/lists'
        )
          renderSources(f.value);
      });
      void refresh();
    </script>
  </body>
</html>
