name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (typecheck / lint / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    # 构建产物直接传到 Release，不经 actions/upload-artifact：
    # 一次发版的安装包总量超过 Free 计划的 500 MB artifact 配额。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 双架构必须单 job 构建：electron-builder 一次构建产出唯一的
          # latest-mac.yml（含 arm64 / x64 两条 zip 条目），拆 job 会互相覆盖。
          - name: macOS arm64 + x64
            os: macos-15
            platform: mac
            arch: arm64,x64
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    # Apple 公证队列可能长时间排队（实测单架构可达 33 分钟），双架构叠加后
    # 60 分钟不够，留足余量避免无故被超时打断。
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Compare tag with package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $APP_VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="codesign-only"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 关闭空闲自动上锁：双架构公证可能排队数十分钟，期间钥匙串一旦上锁，
          # 后续 codesign 会等待无法在 CI 上弹出的授权框而无限挂起。
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          # 新建钥匙串必须进入搜索列表，否则 security / codesign 找不到导入的身份
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          # codesign: 分区放行是私钥被 codesign 取用的必要条件
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Unlock macOS signing keychain
        # 二次兜底：公证排队期间钥匙串仍可能被系统策略上锁。
        if: matrix.platform == 'mac'
        run: security unlock-keychain -p "codesign-only" "$RUNNER_TEMP/build.keychain"

      - name: Package installers (${{ matrix.platform }})
        # electron-builder must not self-publish: softprops/action-gh-release
        # owns the GitHub Release in the publish job. Notarization credentials
        # are only consumed by the macOS build; absence skips notarization.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "mac" ]; then
            # 双架构一次构建：合并产出唯一的 latest-mac.yml
            pnpm exec electron-builder --mac --arm64 --x64 --publish never
          else
            pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
          fi

      - name: Verify packaged artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.rpm)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "::error::electron-builder produced no installer artifacts."
            ls -la dist || true
            exit 1
          fi
          printf '%s\n' "${artifacts[@]}"

      - name: Verify macOS signature and notarization
        # electron-builder 在证书导入失败或公证凭据缺失时只记录日志并继续出包，
        # CI 会「绿着」产出未签名 / 未公证的安装包，导致客户端静默更新失败。
        # 这里显式断言签名身份与 Gatekeeper 放行结果。
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/WorkStudio.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "::error::no packaged WorkStudio.app found under dist/mac*"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "==> $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # 先落变量再匹配：`codesign ... | grep -q` 在 pipefail 下可能因
            # SIGPIPE 误判，失败时也看不到真实签名信息。
            signature="$(codesign -dv --verbose=4 "$app" 2>&1 || true)"
            printf '%s\n' "$signature"
            grep -q "Developer ID Application" <<<"$signature" || {
              echo "::error::$app is not signed with Developer ID Application"
              exit 1
            }
            gatekeeper="$(spctl -a -vvv "$app" 2>&1 || true)"
            printf '%s\n' "$gatekeeper"
            grep -q "accepted" <<<"$gatekeeper" || {
              echo "::error::$app was rejected by Gatekeeper (not notarized?)"
              exit 1
            }
          done

      - name: Upload installers to release
        # latest*.yml 是 electron-updater 更新 feed：mac 静默更新读
        # latest-mac.yml（双架构条目在同一文件）；yml 与安装包一起上传。
        # 首个到达的 job 顺手创建 draft Release，其余 job 直接追加资产。
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.rpm dist/*.blockmap dist/*.yml)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes || true
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # 该 job 不 checkout 仓库，gh 无法从 git remote 推断仓库，必须显式指定。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'
