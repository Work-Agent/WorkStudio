name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (typecheck / lint / sdk / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sdk_publish: ${{ steps.sdk_policy.outputs.publish }}
      sdk_version: ${{ steps.sdk_policy.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # release-sdk.mjs 需要完整历史与 tag 来比较 SDK 变化。
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare tag with package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $APP_VERSION."
            exit 1
          fi

      - name: Check SDK release policy
        id: sdk_policy
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-sdk.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: SDK typecheck
        run: pnpm sdk:typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  sdk:
    name: Publish SDK
    if: startsWith(github.ref, 'refs/tags/v')
    # 等三平台安装包都成功再发 npm，避免 app 发布失败但 npm 已经出现新版本。
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # npm provenance 需要；即使暂时不用，也便于后续打开。
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: needs.verify.outputs.sdk_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        if: needs.verify.outputs.sdk_publish == 'true'
        env:
          SDK_VERSION: ${{ needs.verify.outputs.sdk_version }}
        run: |
          set -euo pipefail
          if [ -z "$SDK_VERSION" ]; then
            echo "::error::SDK publish 被标记为 true，但 sdk_version 为空。"
            exit 1
          fi
          if npm view "@work-studio/sdk@$SDK_VERSION" version >/dev/null 2>&1; then
            echo "::notice::@work-studio/sdk@$SDK_VERSION 已存在，跳过 npm publish。"
            exit 0
          fi
          pnpm sdk:build
          cd packages/sdk
          # 身份由 npm Trusted Publisher 的 OIDC 提供：不要配置 NPM_TOKEN /
          # NODE_AUTH_TOKEN，两者同时存在会让 npm 走 token 而不是 OIDC。
          # provenance 只支持公开源仓库：私有仓库自动省略，仓库转公开后自动启用。
          args=(--access public)
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            args+=(--provenance)
          fi
          npm publish "${args[@]}"

      - name: Attach SDK tarball to release
        if: needs.verify.outputs.sdk_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pnpm sdk:build
          cd packages/sdk
          npm pack --silent > /tmp/sdk-pack.txt
          TARBALL="$(tail -n 1 /tmp/sdk-pack.txt)"
          cd ../..
          sha256sum "packages/sdk/$TARBALL" | awk '{print $1}' > "packages/sdk/$TARBALL.sha256"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes || true
          fi
          gh release upload "$TAG" "packages/sdk/$TARBALL" "packages/sdk/$TARBALL.sha256" --clobber

      - name: Summary
        run: |
          echo "SDK publish: ${{ needs.verify.outputs.sdk_publish }}"
          echo "SDK version: ${{ needs.verify.outputs.sdk_version }}"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    # 构建产物直接传到 Release，不经 actions/upload-artifact：
    # 一次发版的安装包总量超过 Free 计划的 500 MB artifact 配额。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 双架构必须单 job 构建：electron-builder 一次构建产出唯一的
          # latest-mac.yml（含 arm64 / x64 两条 zip 条目），拆 job 会互相覆盖。
          - name: macOS arm64 + x64
            os: macos-15
            platform: mac
            arch: arm64,x64
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    # Apple 公证队列可能长时间排队（实测单架构可达 33 分钟），双架构叠加后
    # 60 分钟不够，留足余量避免无故被超时打断。
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Compare tag with package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $APP_VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Sync builtin plugins
        run: pnpm plugins:sync

      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="codesign-only"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 关闭空闲自动上锁：双架构公证可能排队数十分钟，期间钥匙串一旦上锁，
          # 后续 codesign 会等待无法在 CI 上弹出的授权框而无限挂起。
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          # 新建钥匙串必须进入搜索列表，否则 security / codesign 找不到导入的身份
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          # codesign: 分区放行是私钥被 codesign 取用的必要条件
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Unlock macOS signing keychain
        # 二次兜底：公证排队期间钥匙串仍可能被系统策略上锁。
        if: matrix.platform == 'mac'
        run: security unlock-keychain -p "codesign-only" "$RUNNER_TEMP/build.keychain"

      - name: Package installers (${{ matrix.platform }})
        # electron-builder must not self-publish: softprops/action-gh-release
        # owns the GitHub Release in the publish job. Notarization credentials
        # are only consumed by the macOS build; absence skips notarization.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # 正式档标记：应用据此使用正式 profile；缺标记时一律当开发档。
          FLAVOR="--config.extraMetadata.wsFlavor=release"
          if [ "${{ matrix.platform }}" = "mac" ]; then
            # 双架构一次构建：合并产出唯一的 latest-mac.yml
            pnpm exec electron-builder --mac --arm64 --x64 --publish never $FLAVOR
          else
            pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never $FLAVOR
          fi

      - name: Verify packaged artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.rpm)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "::error::electron-builder produced no installer artifacts."
            ls -la dist || true
            exit 1
          fi
          printf '%s\n' "${artifacts[@]}"

      - name: Verify macOS signature and notarization
        # electron-builder 在证书导入失败或公证凭据缺失时只记录日志并继续出包，
        # CI 会「绿着」产出未签名 / 未公证的安装包，导致客户端静默更新失败。
        # 这里显式断言签名身份与 Gatekeeper 放行结果。
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/WorkStudio.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "::error::no packaged WorkStudio.app found under dist/mac*"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "==> $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # 先落变量再匹配：`codesign ... | grep -q` 在 pipefail 下可能因
            # SIGPIPE 误判，失败时也看不到真实签名信息。
            signature="$(codesign -dv --verbose=4 "$app" 2>&1 || true)"
            printf '%s\n' "$signature"
            grep -q "Developer ID Application" <<<"$signature" || {
              echo "::error::$app is not signed with Developer ID Application"
              exit 1
            }
            gatekeeper="$(spctl -a -vvv "$app" 2>&1 || true)"
            printf '%s\n' "$gatekeeper"
            grep -q "accepted" <<<"$gatekeeper" || {
              echo "::error::$app was rejected by Gatekeeper (not notarized?)"
              exit 1
            }
          done

      - name: Upload installers to release
        # latest*.yml 是 electron-updater 更新 feed：mac 静默更新读
        # latest-mac.yml（双架构条目在同一文件）；yml 与安装包一起上传。
        # 首个到达的 job 顺手创建 draft Release，其余 job 直接追加资产。
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.rpm dist/*.blockmap dist/*.yml)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes || true
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build, sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # 显式指定仓库，不依赖 gh 从 git remote 推断。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SDK_VERSION: ${{ needs.verify.outputs.sdk_version }}
          SDK_PUBLISH: ${{ needs.verify.outputs.sdk_publish }}
        run: |
          set -euo pipefail
          if [[ -n "$SDK_VERSION" ]]; then
            BODY="$(gh release view "$TAG" --json body --jq .body)"
            if [[ "$TAG" == *-* ]]; then
              SDK_LINE="SDK: not published for prerelease"
            elif [[ "$SDK_PUBLISH" == "true" ]]; then
              SDK_LINE="SDK: \`@work-studio/sdk@$SDK_VERSION\` (published to npm)"
            else
              SDK_LINE="SDK: \`@work-studio/sdk@$SDK_VERSION\` (unchanged)"
            fi
            if ! grep -q '^SDK: ' <<<"$BODY"; then
              printf '%s\n\n---\n%s\n' "$BODY" "$SDK_LINE" > "$RUNNER_TEMP/release-notes.md"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            fi
          fi
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'

  mirror:
    name: Mirror installers to COS
    # 跨境上传很慢（GitHub 美国 runner → 腾讯云 ap-nanjing），因此放在 Release
    # 公开之后单独跑：GitHub 用户先拿到更新，镜像补齐后再切换 latest.json。
    # 预发布（tag 含 `-`）不进镜像，与 GitHub 的 latest 语义一致。
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern '*.dmg' --pattern '*.exe' --pattern '*.AppImage'

      - name: Install COS client
        # 仓库 package.json 含 workspace:* 协议，npm 无法在根目录安装；
        # 装到临时目录后复制 node_modules，供脚本按就近规则解析。
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cos-sdk" --no-package-lock --no-audit \
            --no-fund --ignore-scripts cos-nodejs-sdk-v5
          mkdir -p "$GITHUB_WORKSPACE/node_modules"
          cp -R "$RUNNER_TEMP/cos-sdk/node_modules/." "$GITHUB_WORKSPACE/node_modules/"

      - name: Upload installers to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${COS_SECRET_ID:-}" || -z "${COS_SECRET_KEY:-}" ]]; then
            echo "::notice::未配置 COS_SECRET_ID / COS_SECRET_KEY，跳过 COS 镜像上传。"
            exit 0
          fi
          node scripts/cos-release.mjs upload --tag "$TAG" --platform mac --files dist/*.dmg
          node scripts/cos-release.mjs upload --tag "$TAG" --platform win --files dist/*.exe
          node scripts/cos-release.mjs upload --tag "$TAG" --platform linux --files dist/*.AppImage
          node scripts/cos-release.mjs manifest --tag "$TAG"
