name: CI

# 自动 CI 暂时关闭：当前只保留跨平台打包与 tag 发布链路，自检走本地 pnpm verify。
# 项目 public 后恢复 push / pull_request 触发（取消下面注释即可）。
on:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**/*.md'
  # pull_request:
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
