# electron-builder 打包配置（构建产物由 electron-vite 输出到 out/，见 electron.vite.config.ts）
appId: com.qingo.workstudio
productName: WorkStudio
copyright: Copyright © 2026 qingo

directories:
  output: dist

# 更新 feed 来源：构建时生成 app-update.yml 内嵌到应用，
# 运行期 electron-updater（mac）据此定位 GitHub Releases。
# private: true 让 electron-updater 运行期从 GH_TOKEN 环境变量取访问令牌
# （私有仓库，由更新服务在检查前注入用户配置的 Token）。
publish:
  provider: github
  owner: Work-Agent
  repo: WorkStudio
  private: true

# 只打包 electron-vite 的产物，不含源码与开发依赖
files:
  - out/**/*
  - package.json

# pi 及其依赖已全部打进 out/main bundle（externalizeDeps: false），
# 运行期不加载 node_modules；应用代码与 bundle 同处 asar。
asar: true

# Electron 二进制开关（与安全基线一致：禁 Node 注入、禁调试参数、只从 asar 加载）
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# 安装包文件名不含版本号：Release 资产名保持稳定，
# README 里的 /releases/latest/download/<name> 直链可以长期指向最新版本。
mac:
  category: public.app-category.productivity
  artifactName: ${productName}-mac-${arch}.${ext}
  # Developer ID 签名：不指定 identity，electron-builder 自动从钥匙串
  # 发现 Developer ID Application 证书（CI 由 release workflow 导入 p12）。
  # hardened runtime 是公证的前置条件；公证凭据（APPLE_ID 等）齐备时自动执行。
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip

win:
  artifactName: ${productName}-win-${arch}.${ext}
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Utility
  maintainer: qingo <97383102@qq.com>
  artifactName: ${productName}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb
    - rpm
